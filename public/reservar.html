<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar turno</title>
<style>
:root{
  --cyan:#40C7ED; --sky:#4FA6F0; --primary:#2980D4; --deep:#1A599E;
  --bg:#F0FAFF; --bg-soft:#E0F2FD; --surface:#fff;
  --success:#21BF8C; --danger:#F25C66; --warning:#FFB333;
  --text:#1C334F; --text-soft:#61809E; --text-muted:#99B3C9;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-soft) 50%,var(--bg) 100%);
  min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;top:-20%;left:-30%;width:80vw;height:80vw;
  background:radial-gradient(circle,rgba(64,199,237,.15),transparent 70%);
  filter:blur(60px);pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-10%;right:-20%;width:70vw;height:70vw;
  background:radial-gradient(circle,rgba(79,166,240,.12),transparent 70%);
  filter:blur(50px);pointer-events:none;z-index:0;
}
.wrap{max-width:520px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* Header */
.hero{
  background:linear-gradient(135deg,var(--cyan),var(--sky),var(--primary));
  border-radius:22px;padding:24px;color:#fff;margin-bottom:20px;
  box-shadow:0 20px 40px rgba(41,128,212,.3);
  border:1px solid rgba(255,255,255,.25);position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 50%,rgba(255,255,255,.12));
}
.hero>*{position:relative;z-index:1}
.doc-row{display:flex;align-items:center;gap:16px}
.avatar{
  width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;
  border:2px solid rgba(255,255,255,.4);flex-shrink:0;
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.doc-name{font-size:22px;font-weight:700;margin-bottom:3px}
.doc-spec{font-size:14px;opacity:.9}
.doc-lic{font-size:12px;opacity:.75;margin-top:2px}
.org-info{
  margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);
  display:flex;flex-direction:column;gap:6px;font-size:13px;
}
.org-info div{display:flex;align-items:center;gap:8px;opacity:.9}

/* Cards */
.card{
  background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:0 10px 30px rgba(41,128,212,.08),0 2px 4px rgba(26,89,158,.04);
  border:1px solid rgba(64,199,237,.15);
}
.card-title{
  font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text-soft);margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-title .ico{
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(64,199,237,.2),rgba(79,166,240,.08));font-size:13px;
}

/* Steps */
.steps{display:flex;gap:6px;margin-bottom:20px}
.step{
  flex:1;height:4px;border-radius:2px;background:var(--bg-soft);transition:.3s;
}
.step.done{background:linear-gradient(90deg,var(--cyan),var(--sky))}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav button{
  background:var(--bg-soft);border:none;width:34px;height:34px;border-radius:10px;
  color:var(--primary);font-size:16px;cursor:pointer;transition:.2s;
}
.cal-nav button:hover{background:var(--cyan);color:#fff}
.cal-month{font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{
  font-size:11px;font-weight:600;color:var(--text-muted);text-align:center;padding:4px 0;
}
.cal-day{
  aspect-ratio:1;border:none;background:var(--bg-soft);border-radius:10px;
  font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cal-day:disabled{opacity:.25;cursor:not-allowed}
.cal-day.empty{background:transparent;cursor:default}
.cal-day.active{
  background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;
  box-shadow:0 6px 16px rgba(64,199,237,.4);
}
.cal-day.has-slots::after{
  content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:var(--success);
}
.cal-day.active.has-slots::after{background:#fff}

/* Slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:16px}
.slot{
  padding:12px 8px;border:1.5px solid rgba(64,199,237,.25);background:#fff;
  border-radius:12px;font-size:14px;font-weight:600;color:var(--primary);
  cursor:pointer;transition:.2s;
}
.slot:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 6px 14px rgba(64,199,237,.2)}
.slot.active{
  background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px rgba(64,199,237,.35);
}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:14px;border:1.5px solid rgba(64,199,237,.2);border-radius:12px;
  font-size:15px;font-family:inherit;background:rgba(255,255,255,.7);color:var(--text);
  transition:.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(64,199,237,.12);
}
.field textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Buttons */
.btn{
  width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;
  cursor:pointer;transition:.2s;font-family:inherit;
  background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;
  box-shadow:0 10px 24px rgba(41,128,212,.3);
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px rgba(41,128,212,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{
  background:var(--bg-soft);color:var(--primary);box-shadow:none;
}
.btn-ghost:hover{background:rgba(64,199,237,.15);transform:none;box-shadow:none}

/* Payment box */
.pay-box{
  background:linear-gradient(135deg,rgba(255,179,51,.1),rgba(255,179,51,.04));
  border:1.5px solid rgba(255,179,51,.3);border-radius:14px;padding:18px;margin:16px 0;
}
.pay-amount{font-size:32px;font-weight:700;color:var(--warning);margin:8px 0}
.pay-detail{
  display:flex;justify-content:space-between;padding:8px 0;font-size:14px;
  border-bottom:1px solid rgba(255,179,51,.15);
}
.pay-detail:last-child{border:none}
.pay-detail strong{font-family:monospace;font-size:14px}
.copy-btn{
  background:rgba(255,179,51,.15);border:none;padding:3px 10px;border-radius:6px;
  font-size:11px;color:#8a5a00;cursor:pointer;margin-left:8px;
}

/* Summary */
.summary-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid var(--bg-soft)}
.summary-row:last-child{border:none}
.summary-row span:first-child{color:var(--text-soft)}
.summary-row span:last-child{font-weight:600}

/* Status */
.status-icon{
  width:80px;height:80px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:36px;
}
.status-icon.ok{background:linear-gradient(135deg,var(--success),#1a9970);color:#fff;box-shadow:0 12px 28px rgba(33,191,140,.35)}
.status-icon.wait{background:linear-gradient(135deg,var(--warning),#e69500);color:#fff;box-shadow:0 12px 28px rgba(255,179,51,.35)}
.badge{
  display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;
}
.badge.ok{background:rgba(33,191,140,.12);color:var(--success)}
.badge.wait{background:rgba(255,179,51,.14);color:#b37700}
.center{text-align:center}
.muted{color:var(--text-soft);font-size:14px;line-height:1.6}
.spinner{
  width:36px;height:36px;border:3px solid var(--bg-soft);border-top-color:var(--cyan);
  border-radius:50%;animation:spin .8s linear infinite;margin:30px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
.note{
  background:rgba(64,199,237,.08);border-left:3px solid var(--cyan);
  padding:12px 14px;border-radius:8px;font-size:13px;color:var(--text-soft);margin-top:12px;line-height:1.5;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOADING -->
  <div id="loading"><div class="spinner"></div></div>

  <!-- MAIN -->
  <div id="app" class="hidden">

    <!-- Hero -->
    <div class="hero">
      <div class="doc-row">
        <div class="avatar" id="avatar">DR</div>
        <div>
          <div class="doc-name" id="docName">—</div>
          <div class="doc-spec" id="docSpec">—</div>
          <div class="doc-lic" id="docLic"></div>
        </div>
      </div>
      <div class="org-info" id="orgInfo"></div>
    </div>

    <div class="steps">
      <div class="step done" id="s1"></div>
      <div class="step" id="s2"></div>
      <div class="step" id="s3"></div>
    </div>

    <!-- STEP 1: Date + Time -->
    <div id="step1">
      <div class="card">
        <div class="card-title"><span class="ico">📅</span> Elegí el día</div>
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <div class="cal-month" id="calMonth"></div>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="card hidden" id="slotsCard">
        <div class="card-title"><span class="ico">🕐</span> Horarios disponibles</div>
        <div id="slotsContent"></div>
      </div>

      <button class="btn" id="btnNext1" onclick="goStep(2)" disabled>Continuar</button>
    </div>

    <!-- STEP 2: Data -->
    <div id="step2" class="hidden">
      <div class="card">
        <div class="card-title"><span class="ico">👤</span> Tus datos</div>
        <div class="row">
          <div class="field"><label>Nombre *</label><input id="firstName" placeholder="Juan"></div>
          <div class="field"><label>Apellido *</label><input id="lastName" placeholder="Pérez"></div>
        </div>
        <div class="field"><label>Teléfono *</label><input id="phone" type="tel" placeholder="11 2345 6789"></div>
        <div class="row">
          <div class="field"><label>DNI</label><input id="dni" placeholder="30123456"></div>
          <div class="field"><label>Nacimiento</label><input id="dob" type="date"></div>
        </div>
        <div class="field"><label>Email</label><input id="email" type="email" placeholder="tu@email.com"></div>
      </div>

      <div class="card" id="insuranceCard">
        <div class="card-title"><span class="ico">🏥</span> Obra social</div>
        <div class="field"><label id="insLabel">Obra social / Prepaga</label><input id="insurance" placeholder="OSDE, Swiss Medical..."></div>
        <div class="field"><label>Nro. de afiliado</label><input id="insNumber" placeholder="123456789"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ico">📝</span> Motivo</div>
        <div class="field"><textarea id="reason" placeholder="Contanos brevemente el motivo de tu consulta"></textarea></div>
      </div>

      <div class="card hidden" id="paymentCard">
        <div class="card-title"><span class="ico">💳</span> Forma de pago de la seña</div>
        <div class="field">
          <select id="payMethod">
            <option value="transfer">Transferencia bancaria</option>
            <option value="cash">Efectivo en el consultorio</option>
          </select>
        </div>
      </div>

      <button class="btn" onclick="submitBooking()" id="btnSubmit">Confirmar reserva</button>
      <button class="btn btn-ghost" onclick="goStep(1)" style="margin-top:10px">Volver</button>
    </div>

    <!-- STEP 3: Confirmation -->
    <div id="step3" class="hidden">
      <div class="card center">
        <div class="status-icon" id="statusIcon">✓</div>
        <h2 id="statusTitle" style="font-size:22px;margin-bottom:8px">¡Turno reservado!</h2>
        <p class="muted" id="statusMsg"></p>
        <div style="margin-top:14px"><span class="badge" id="statusBadge">Confirmado</span></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ico">📋</span> Resumen</div>
        <div id="summaryContent"></div>
      </div>

      <div id="paymentInfo"></div>

      <div class="card" id="policyCard">
        <div class="card-title"><span class="ico">ℹ️</span> Información</div>
        <div class="muted" id="policyText"></div>
      </div>
    </div>

  </div>
</div>

<script>
const API = window.location.origin.includes('localhost')
  ? 'http://localhost:3100'
  : 'https://mediclick.art3d-studio.com.ar';

const slug = window.location.pathname.split('/').filter(Boolean).pop() || 'demo';

let profile = null;
let selectedDate = null;
let selectedSlot = null;
let currentMonth = new Date();

// ─── Init ───────────────────────────────────────────────
async function init(){
  try {
    const res = await fetch(`${API}/api/v1/public/booking/${slug}`);
    if (!res.ok) throw new Error('not found');
    profile = await res.json();
    renderProfile();
    renderCalendar();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<div class="card center"><div style="font-size:44px;margin-bottom:12px">🔍</div>' +
      '<h2 style="margin-bottom:8px">Página no encontrada</h2>' +
      '<p class="muted">Este enlace de reservas no existe o fue desactivado.</p></div>';
  }
}

function renderProfile(){
  document.getElementById('docName').textContent = 'Dr. ' + profile.doctor_name;
  document.getElementById('docSpec').textContent = profile.specialty || 'Medicina';
  if (profile.medical_license)
    document.getElementById('docLic').textContent = 'Mat. ' + profile.medical_license;

  const initials = profile.doctor_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const av = document.getElementById('avatar');
  if (profile.avatar_url) av.innerHTML = `<img src="${profile.avatar_url}" alt="">`;
  else av.textContent = initials;

  let info = '';
  if (profile.org_name) info += `<div>🏥 ${profile.org_name}</div>`;
  if (profile.address) info += `<div>📍 ${profile.address}${profile.city ? ', '+profile.city : ''}</div>`;
  if (profile.org_phone) info += `<div>📞 ${profile.org_phone}</div>`;
  document.getElementById('orgInfo').innerHTML = info;

  // Insurance required
  if (profile.requires_insurance_info) {
    document.getElementById('insLabel').textContent = 'Obra social / Prepaga *';
  }

  // Payment method options
  if (profile.requires_deposit) {
    document.getElementById('paymentCard').classList.remove('hidden');
    const sel = document.getElementById('payMethod');
    if (profile.payment_methods === 'transfer') {
      sel.innerHTML = '<option value="transfer">Transferencia bancaria</option>';
    } else if (profile.payment_methods === 'cash') {
      sel.innerHTML = '<option value="cash">Efectivo en el consultorio</option>';
    }
  }
}

// ─── Calendar ───────────────────────────────────────────
function renderCalendar(){
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calMonth').textContent = `${months[m]} ${y}`;

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const maxDate = new Date(today.getTime() + (profile.max_days_in_advance||60)*86400000);

  let html = ['D','L','M','M','J','V','S'].map(d=>`<div class="cal-head">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) html += '<div class="cal-day empty"></div>';

  for(let d=1;d<=daysInMonth;d++){
    const date = new Date(y,m,d);
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const disabled = date < today || date > maxDate;
    const active = selectedDate === iso;
    html += `<button class="cal-day ${active?'active':''}" ${disabled?'disabled':''} onclick="selectDate('${iso}')">${d}</button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function changeMonth(delta){
  currentMonth.setMonth(currentMonth.getMonth()+delta);
  renderCalendar();
}

async function selectDate(iso){
  selectedDate = iso;
  selectedSlot = null;
  renderCalendar();
  updateNextBtn();

  const card = document.getElementById('slotsCard');
  const content = document.getElementById('slotsContent');
  card.classList.remove('hidden');
  content.innerHTML = '<div class="spinner"></div>';

  try {
    const res = await fetch(`${API}/api/v1/public/booking/${slug}/slots?date=${iso}`);
    const slots = await res.json();
    const available = slots.filter(s=>s.isAvailable);

    if (!available.length){
      content.innerHTML = '<p class="muted center" style="padding:20px 0">No hay horarios disponibles este día</p>';
      return;
    }
    content.innerHTML = '<div class="slots">' + available.map(s=>
      `<button class="slot" onclick="selectSlot('${s.startTime}','${s.endTime}',this)">${s.startTime}</button>`
    ).join('') + '</div>';
  } catch(e){
    content.innerHTML = '<p class="muted center">Error al cargar horarios</p>';
  }
}

function selectSlot(start, end, el){
  selectedSlot = {start, end};
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  updateNextBtn();
}

function updateNextBtn(){
  document.getElementById('btnNext1').disabled = !(selectedDate && selectedSlot);
}

// ─── Steps ──────────────────────────────────────────────
function goStep(n){
  [1,2,3].forEach(i=>{
    document.getElementById('step'+i).classList.toggle('hidden', i!==n);
    document.getElementById('s'+i).classList.toggle('done', i<=n);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── Submit ─────────────────────────────────────────────
async function submitBooking(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if(!firstName || !lastName || !phone){
    alert('Completá nombre, apellido y teléfono');
    return;
  }
  if(profile.requires_insurance_info && !document.getElementById('insurance').value.trim()){
    alert('Este médico requiere datos de obra social');
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const body = {
    firstName, lastName, phone,
    email: document.getElementById('email').value.trim() || undefined,
    dni: document.getElementById('dni').value.trim() || undefined,
    dateOfBirth: document.getElementById('dob').value || undefined,
    insuranceProvider: document.getElementById('insurance').value.trim() || undefined,
    insuranceNumber: document.getElementById('insNumber').value.trim() || undefined,
    requestedDate: selectedDate,
    requestedStartTime: selectedSlot.start,
    requestedEndTime: selectedSlot.end,
    reason: document.getElementById('reason').value.trim() || undefined,
    paymentMethod: profile.requires_deposit ? document.getElementById('payMethod').value : undefined,
    source: 'public_link'
  };

  try {
    const res = await fetch(`${API}/api/v1/public/booking/${slug}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if(!res.ok) throw new Error(data.message || 'Error');

    showConfirmation(data);
    goStep(3);
  } catch(e){
    alert(e.message || 'No se pudo completar la reserva');
    btn.disabled = false;
    btn.textContent = 'Confirmar reserva';
  }
}

function showConfirmation(data){
  const status = data.status;
  const icon = document.getElementById('statusIcon');
  const title = document.getElementById('statusTitle');
  const msg = document.getElementById('statusMsg');
  const badge = document.getElementById('statusBadge');

  if(status === 'confirmed'){
    icon.className = 'status-icon ok'; icon.textContent = '✓';
    title.textContent = '¡Turno confirmado!';
    msg.textContent = 'Tu turno quedó reservado. Te esperamos.';
    badge.className = 'badge ok'; badge.textContent = 'Confirmado';
  } else if(status === 'pending_payment'){
    icon.className = 'status-icon wait'; icon.textContent = '💳';
    title.textContent = 'Falta abonar la seña';
    msg.textContent = 'Tu horario está reservado. Completá el pago para confirmarlo.';
    badge.className = 'badge wait'; badge.textContent = 'Esperando pago';
  } else {
    icon.className = 'status-icon wait'; icon.textContent = '⏳';
    title.textContent = 'Solicitud enviada';
    msg.textContent = 'El médico va a revisar tu solicitud y te confirmamos a la brevedad.';
    badge.className = 'badge wait'; badge.textContent = 'Pendiente';
  }

  // Summary
  const d = new Date(selectedDate+'T00:00:00');
  const fmt = d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('summaryContent').innerHTML = `
    <div class="summary-row"><span>Médico</span><span>Dr. ${profile.doctor_name}</span></div>
    <div class="summary-row"><span>Fecha</span><span>${fmt}</span></div>
    <div class="summary-row"><span>Hora</span><span>${selectedSlot.start} hs</span></div>
    <div class="summary-row"><span>Lugar</span><span>${profile.org_name||'—'}</span></div>
    ${profile.address?`<div class="summary-row"><span>Dirección</span><span>${profile.address}</span></div>`:''}
  `;

  // Payment info
  if(data.paymentInfo){
    const p = data.paymentInfo;
    let payHtml = `<div class="card"><div class="card-title"><span class="ico">💳</span> Datos para el pago</div>
      <div class="pay-box">
        <div class="muted">Seña a abonar</div>
        <div class="pay-amount">$${Number(p.amount).toLocaleString('es-AR')}</div>`;

    if(document.getElementById('payMethod')?.value === 'transfer' && p.cbu){
      payHtml += `
        <div class="pay-detail"><span>Banco</span><strong>${p.bankName||'—'}</strong></div>
        <div class="pay-detail"><span>Titular</span><strong>${p.accountHolder||'—'}</strong></div>
        <div class="pay-detail"><span>CBU</span><strong>${p.cbu}<button class="copy-btn" onclick="copyTxt('${p.cbu}')">Copiar</button></strong></div>
        ${p.alias?`<div class="pay-detail"><span>Alias</span><strong>${p.alias}<button class="copy-btn" onclick="copyTxt('${p.alias}')">Copiar</button></strong></div>`:''}`;
    } else {
      payHtml += `<div class="pay-detail"><span>Método</span><strong>Efectivo en consultorio</strong></div>`;
    }

    payHtml += `</div>
      <div class="note">Tenés ${p.deadlineMinutes} minutos para completar el pago.
      Una vez abonado, el médico confirma tu turno.</div>
      <p class="muted" style="margin-top:14px;font-size:12px">Guardá este enlace para seguir tu reserva:</p>
      <div style="background:var(--bg-soft);padding:10px;border-radius:8px;margin-top:6px;font-size:11px;word-break:break-all">
        ${window.location.origin}/turno/${data.confirmationToken}
      </div>
      </div>`;
    document.getElementById('paymentInfo').innerHTML = payHtml;
  }

  // Policy
  let policy = '';
  if(profile.instructions) policy += `<p style="margin-bottom:10px">${profile.instructions}</p>`;
  if(profile.cancellation_policy_text) policy += `<p>${profile.cancellation_policy_text}</p>`;
  else if(profile.min_hours_before_cancel)
    policy += `<p>Podés cancelar sin cargo hasta ${profile.min_hours_before_cancel} horas antes del turno.</p>`;

  if(policy) document.getElementById('policyText').innerHTML = policy;
  else document.getElementById('policyCard').classList.add('hidden');
}

function copyTxt(t){
  navigator.clipboard.writeText(t);
  event.target.textContent = '✓';
  setTimeout(()=>event.target.textContent='Copiar',1500);
}

init();
</script>
</body>
</html>
