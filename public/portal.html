<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0097A7">
<title>MediClick — Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#40C7ED;--sky:#4FA6F0;--primary:#2980D4;--deep:#1A599E;
  --bg:#F4FAFE;--bg-soft:#E4F2FD;--surface:#fff;
  --success:#21BF8C;--danger:#F25C66;--warning:#FFB333;
  --text:#1C334F;--text-soft:#61809E;--text-muted:#99B3C9;
  --radius:14px;--shadow:0 4px 20px rgba(41,128,212,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#0a3d68,#1a599e);color:#fff;padding:20px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s}
.sidebar .brand{padding:0 20px 24px;font-size:13px;font-weight:700;letter-spacing:1.5px;opacity:.7;display:flex;align-items:center;gap:8px}
.sidebar .brand svg{width:20px;height:20px;opacity:.8}
.sidebar .user-info{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.sidebar .user-name{font-size:15px;font-weight:600}
.sidebar .user-role{font-size:12px;opacity:.6;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;font-size:14px;cursor:pointer;transition:.15s;color:rgba(255,255,255,.7);border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--cyan);font-weight:600}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:16px 20px 6px;opacity:.4;font-weight:600}
.nav-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:8px}
.main{margin-left:240px;flex:1;padding:24px 32px;max-width:1200px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar h1{font-size:22px;font-weight:700;color:var(--text)}
.topbar .badge{background:var(--bg-soft);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid rgba(79,166,240,.06);margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(79,166,240,.06)}
.stat-value{font-size:28px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:12px;color:var(--text-soft)}
.stat-card.cyan .stat-value{color:var(--cyan)}
.stat-card.primary .stat-value{color:var(--primary)}
.stat-card.success .stat-value{color:var(--success)}
.stat-card.warning .stat-value{color:var(--warning)}
.stat-card.danger .stat-value{color:var(--danger)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid #EEF3F9}
td{padding:12px;border-bottom:1px solid #F2F6FA;vertical-align:middle}
tr:hover td{background:var(--bg-soft)}
.badge-sm{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-sm.confirmed{background:#e0f7ed;color:#0f6e56}
.badge-sm.pending{background:#fff3d9;color:#85500b}
.badge-sm.completed{background:#eef3f9;color:#5f5e5a}
.badge-sm.cancelled{background:#fce8e8;color:#993535}
.badge-sm.in_progress{background:#e1f5fb;color:#0097a7}
.badge-sm.checked_in{background:#ecfdf5;color:#10b981}
.badge-sm.no_show{background:#fce8e8;color:#71243e}
.badge-sm.waiting{background:#e1f5fb;color:#0097a7}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{width:100%;max-width:380px}
.login-header{text-align:center;margin-bottom:28px}
.login-header h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-header p{color:var(--text-soft);font-size:14px;margin-top:6px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:13px;font-size:14px;font-family:inherit;border:1.5px solid #E0ECF5;border-radius:12px;background:#FAFCFE;color:var(--text);outline:none;transition:.2s}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(64,199,237,.15)}
.btn{width:100%;padding:14px;font-size:14px;font-weight:700;font-family:inherit;border:none;border-radius:12px;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;box-shadow:0 6px 20px rgba(41,128,212,.25)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-outline{background:none;border:1.5px solid var(--primary);color:var(--primary)}
.btn-sm{padding:8px 16px;font-size:12px;width:auto;border-radius:8px}
.hidden{display:none!important}
.muted{color:var(--text-muted);font-size:13px}
.center{text-align:center}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.error{color:var(--danger);font-size:13px;margin-top:8px}
.flex{display:flex;gap:12px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.spinner{width:28px;height:28px;border:3px solid var(--bg-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.queue-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;transition:.15s}
.queue-item:hover{background:var(--bg-soft)}
.queue-pos{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.btn-action{border:none;background:none;cursor:pointer;padding:6px;border-radius:6px;transition:.15s}
.btn-action:hover{background:var(--bg-soft)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #EEF3F9;padding-bottom:0}
.tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-muted);transition:.15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover:not(.active){color:var(--text)}

/* Patient portal specific */
.appt-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1px solid #EEF3F9;margin-bottom:10px;transition:.15s}
.appt-card:hover{border-color:var(--cyan);background:rgba(64,199,237,.03)}
.appt-date{text-align:center;min-width:50px}
.appt-date .day{font-size:22px;font-weight:700;color:var(--primary)}
.appt-date .month{font-size:11px;color:var(--text-soft);text-transform:uppercase}
.appt-detail{flex:1}
.appt-detail .time{font-size:14px;font-weight:600}
.appt-detail .doctor{font-size:13px;color:var(--text-soft)}
.appt-detail .place{font-size:12px;color:var(--text-muted)}

/* Responsive */
@media(max-width:768px){
  /* Sidebar & layout */
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px 12px;padding-top:56px}
  .hamburger{display:block!important}

  /* Topbar */
  .topbar{flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .topbar h1{font-size:18px}

  /* Stats grid — 2 columns, smaller padding */
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-value{font-size:22px}

  /* Tables — horizontal scroll, larger touch rows */
  .table-wrap{margin:0 -12px;padding:0 12px}
  table{font-size:12px;min-width:500px}
  th{padding:8px 8px;font-size:10px}
  td{padding:10px 8px}

  /* Calendar — force day view on mobile, stacked toolbar */
  .cal-toolbar{flex-direction:column;align-items:stretch;gap:8px}
  .cal-nav-group{justify-content:center}
  .cal-title{font-size:15px;text-align:center}
  .cal-week{grid-template-columns:48px 1fr !important}
  .cal-week-header{padding:8px 4px;font-size:11px}
  .cal-week-header .day-num{font-size:16px}
  .cal-time-col{font-size:10px;padding:0 4px}
  .cal-event{font-size:10px;padding:3px 4px}
  .cal-event .ev-time{font-size:9px}

  /* Cards */
  .card{padding:14px;margin-bottom:12px;border-radius:12px}
  .card-title{font-size:13px}

  /* Nav items — bigger touch targets */
  .nav-item{padding:14px 20px;font-size:15px}

  /* Tabs */
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .tab{white-space:nowrap;padding:10px 12px;font-size:12px;flex-shrink:0}

  /* Appointment cards (patient view) */
  .appt-card{padding:12px;gap:10px}
  .appt-date .day{font-size:18px}
  .appt-detail .time{font-size:13px}

  /* Queue items */
  .queue-item{padding:8px}

  /* Buttons */
  .btn{padding:14px;font-size:15px;min-height:48px}
  .btn-sm{padding:10px 16px;font-size:13px;min-height:40px}

  /* Inline grids — stack to 1 col on mobile */
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}
  [style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:1fr !important}
  [style*="grid-template-columns:1fr 1fr auto"]{grid-template-columns:1fr !important}

  /* Flex wrapping for action buttons */
  .flex{flex-wrap:wrap}

  /* Login */
  .login-box{padding:0 8px}

  /* Avatar smaller */
  .avatar{width:32px;height:32px;font-size:12px}

  /* Overlay for sidebar */
  .overlay.open{display:block}

  /* Safe area for notched phones */
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}

/* Small phones (< 400px) */
@media(max-width:400px){
  .stats{grid-template-columns:1fr}
  .topbar h1{font-size:16px}
  .stat-value{font-size:20px}
  .main{padding:12px 8px;padding-top:52px}
}

.hamburger{display:none;position:fixed;top:16px;left:16px;z-index:60;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);-webkit-tap-highlight-color:transparent}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;-webkit-tap-highlight-color:transparent}
.overlay.open{display:block}

/* Calendar Outlook-style */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cal-nav-group{display:flex;align-items:center;gap:8px}
.cal-nav-btn{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);transition:.15s;font-family:inherit}
.cal-nav-btn:hover{border-color:var(--teal);color:var(--teal)}
.cal-nav-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.cal-title{font-size:18px;font-weight:600}
.cal-today-btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}

/* Week/Day view */
.cal-week{display:grid;grid-template-columns:60px repeat(7,1fr);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal-week.day-view{grid-template-columns:60px 1fr}
.cal-week-header{background:#FAFAF9;padding:10px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--soft);border-bottom:0.5px solid var(--border);border-right:0.5px solid var(--border)}
.cal-week-header.today{background:var(--teal-light);color:var(--teal);font-weight:600}
.cal-week-header .day-num{font-size:20px;font-weight:600;color:var(--text);display:block;margin-top:2px}
.cal-week-header.today .day-num{color:var(--teal)}
.cal-time-col{font-size:11px;color:var(--muted);text-align:right;padding:0 8px;height:48px;display:flex;align-items:flex-start;justify-content:flex-end;border-right:0.5px solid var(--border);padding-top:2px}
.cal-day-col{position:relative;border-right:0.5px solid var(--border);min-height:48px;border-bottom:0.5px solid #f5f5f4}
.cal-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:11px;cursor:pointer;overflow:hidden;z-index:2;border-left:3px solid;transition:.15s}
.cal-event:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3;transform:scale(1.01)}
.cal-event .ev-time{font-weight:600;font-size:10px}
.cal-event .ev-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event .ev-reason{font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.st-confirmed{background:#F0FDFA;border-color:#0D9488;color:#0D9488}
.cal-event.st-checked_in{background:#ECFDF5;border-color:#10B981;color:#065F46}
.cal-event.st-in_progress{background:#EFF6FF;border-color:#3B82F6;color:#1E40AF}
.cal-event.st-completed{background:#F9FAFB;border-color:#9CA3AF;color:#6B7280}
.cal-event.st-cancelled{background:#FEF2F2;border-color:#EF4444;color:#991B1B}
.cal-event.st-pending{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.cal-event.st-no_show{background:#FEF2F2;border-color:#EF4444;color:#991B1B}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <div class="login-header">
      <h1>MediClick</h1>
      <p>Ingresá a tu cuenta</p>
    </div>
    <div class="card">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="loginError" class="error hidden"></div>
      <button class="btn btn-primary mt-16" onclick="doLogin()">Ingresar</button>
      
      <div style="display:flex;align-items:center;gap:12px;margin:16px 0">
        <div style="flex:1;height:0.5px;background:var(--border)"></div>
        <span style="font-size:12px;color:var(--muted)">o continuá con</span>
        <div style="flex:1;height:0.5px;background:var(--border)"></div>
      </div>
      
      <button class="btn" onclick="loginWithGoogle()" style="background:#fff;color:var(--text);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
      </button>
      
      <p class="muted center mt-16">¿No tenés cuenta? <a href="#" onclick="showRegister()" style="color:var(--primary);font-weight:600">Registrate</a></p>
    </div>
    <!-- Registro rápido de paciente -->
    <div class="card hidden" id="registerBox">
      <div class="card-title">Registro de paciente</div>
      <div class="field"><label>Nombre</label><input id="regFN" placeholder="Juan"></div>
      <div class="field"><label>Apellido</label><input id="regLN" placeholder="Pérez"></div>
      <div class="field"><label>Email</label><input id="regEM" type="email" placeholder="tu@email.com"></div>
      <div class="field"><label>Celular</label><input id="regPH" type="tel" placeholder="3447412345"></div>
      <div class="field"><label>Contraseña</label><input id="regPW" type="password" placeholder="Mín. 6 caracteres"></div>
      <div id="regError" class="error hidden"></div>
      <button class="btn btn-primary mt-8" onclick="doRegister()">Crear cuenta</button>
      <button class="btn btn-outline mt-8" onclick="hideRegister()">Volver al login</button>
    </div>
  </div>
</div>

<!-- ═══ APP (post-login) ═══ -->
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app hidden" id="appLayout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      MEDICLICK
    </div>
    <div class="user-info">
      <div class="user-name" id="userName"></div>
      <div class="user-role" id="userRole"></div>
    </div>
    <nav id="navMenu"></nav>
    <div class="nav-bottom">
      <div class="nav-item" onclick="logout()"><span class="icon">🚪</span> Cerrar sesión</div>
    </div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const API = window.location.origin;
let GOOGLE_CLIENT_ID = ''; // Set via env or config
let token = localStorage.getItem('mediclick_token');
let refreshToken = localStorage.getItem('mediclick_refreshToken');
let userId = localStorage.getItem('mediclick_userId');
let userType = localStorage.getItem('mediclick_userType');
let userData = JSON.parse(localStorage.getItem('mediclick_user')||'null');
let currentSection = '';
let isRefreshing = false;

// ─── Auth ────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPassword').value;
  if(!email||!pw){showLoginErr('Completá email y contraseña');return}
  try{
    const r=await apiFetch('/api/v1/auth/login',{method:'POST',body:{email,password:pw}});
    saveSession(r);
    initApp();
  }catch(e){showLoginErr(e.message||'Credenciales inválidas')}
}

async function doRegister(){
  const fn=document.getElementById('regFN').value.trim();
  const ln=document.getElementById('regLN').value.trim();
  const em=document.getElementById('regEM').value.trim();
  const ph=document.getElementById('regPH').value.trim();
  const pw=document.getElementById('regPW').value;
  if(!fn||!ln||!em||!ph||pw.length<6){document.getElementById('regError').textContent='Completá todos los campos (contraseña mín. 6)';document.getElementById('regError').classList.remove('hidden');return}
  try{
    const r=await apiFetch('/api/v1/auth/register/patient',{method:'POST',body:{firstName:fn,lastName:ln,email:em,phone:'+54'+ph.replace(/\D/g,''),password:pw}});
    saveSession(r);initApp();
  }catch(e){document.getElementById('regError').textContent=e.message;document.getElementById('regError').classList.remove('hidden')}
}

function saveSession(r){
  token=r.accessToken;userType=r.userType;userData=r.user||r.doctor;
  if(r.refreshToken) refreshToken=r.refreshToken;
  userId=userData?.id||userData?.user_id||'';
  localStorage.setItem('mediclick_token',token);
  localStorage.setItem('mediclick_refreshToken',refreshToken);
  localStorage.setItem('mediclick_userId',userId);
  localStorage.setItem('mediclick_userType',userType);
  localStorage.setItem('mediclick_user',JSON.stringify(userData));
  if(r.organizations) localStorage.setItem('mediclick_orgs',JSON.stringify(r.organizations));
}

function logout(){localStorage.removeItem('mediclick_token');localStorage.removeItem('mediclick_refreshToken');localStorage.removeItem('mediclick_userId');localStorage.removeItem('mediclick_userType');localStorage.removeItem('mediclick_user');localStorage.removeItem('mediclick_orgs');location.reload()}

function loginWithGoogle(){
  if(!GOOGLE_CLIENT_ID){
    // Fetch client ID from API config
    fetch(`${API}/api/v1/public/config`).then(r=>r.json()).then(c=>{
      GOOGLE_CLIENT_ID=c.googleClientId||'';
      if(GOOGLE_CLIENT_ID) startGoogleAuth();
      else alert('Google Sign-In no está configurado todavía');
    }).catch(()=>alert('Google Sign-In no está configurado todavía'));
    return;
  }
  startGoogleAuth();
}

function startGoogleAuth(){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleResponse,
  });
  google.accounts.id.prompt();
}

async function handleGoogleResponse(response){
  try{
    const r=await apiFetch('/api/v1/auth/google',{method:'POST',body:{idToken:response.credential}});
    saveSession(r);initApp();
  }catch(e){showLoginErr(e.message||'Error con Google Sign-In')}
}
function showLoginErr(msg){const e=document.getElementById('loginError');e.textContent=msg;e.classList.remove('hidden')}

// ─── API helper con auto-refresh ─────────────────────────
async function apiFetch(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;
  const orgs=JSON.parse(localStorage.getItem('mediclick_orgs')||'[]');
  if(orgs[0]) headers['x-organization-id']=orgs[0].org_id||orgs[0].organization_id||'';
  const r=await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});

  // Si el token expiró (401)
  if(r.status===401 && !isRefreshing && !path.includes('/auth/')){
    // Intentar refresh si tenemos refreshToken válido
    if(refreshToken && userId){
      isRefreshing=true;
      try{
        const rr=await fetch(API+'/api/v1/auth/refresh',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({userId,refreshToken})
        });
        if(rr.ok){
          const rd=await rr.json();
          token=rd.accessToken;
          refreshToken=rd.refreshToken||refreshToken;
          localStorage.setItem('mediclick_token',token);
          if(rd.refreshToken) localStorage.setItem('mediclick_refreshToken',rd.refreshToken);
          isRefreshing=false;
          return apiFetch(path,opts);
        }
      }catch(e){}
      isRefreshing=false;
    }
    // Si no hay refreshToken o el refresh falló → logout silencioso
    logout();
    return;
  }

  const d=await r.json();
  if(!r.ok) throw new Error(d.message||'Error');
  return d;
}

let calView=window.innerWidth<=768?'day':'week';
let calDate=new Date();
const isMobile=()=>window.innerWidth<=768;

async function loadAgenda(){
  const main=document.getElementById('mainContent');
  if(isMobile()&&calView==='week') calView='day';
  main.innerHTML=buildCalToolbar()+`<div id="calBody"><div class="spinner"></div></div>`;
  await renderCalView();
}

function buildCalToolbar(){
  const d=calDate;
  const title=calView==='day'
    ? d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
    : `Semana del ${getMonday(d).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}`;
  return `<div class="cal-toolbar">
    <div class="cal-nav-group">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <button class="cal-today-btn" onclick="calToday()">Hoy</button>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
      <span class="cal-title">${title}</span>
    </div>
    <div class="cal-nav-group">
      <button class="cal-nav-btn ${calView==='day'?'active':''}" onclick="calSetView('day')">Día</button>
      <button class="cal-nav-btn ${calView==='week'?'active':''}" onclick="calSetView('week')">Semana</button>
    </div>
  </div>`;
}

function getMonday(d){const dt=new Date(d);const day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);return dt}
function fmtISO(d){return d.toISOString().split('T')[0]}
function calPrev(){calDate.setDate(calDate.getDate()-(calView==='day'?1:7));loadAgenda()}
function calNext(){calDate.setDate(calDate.getDate()+(calView==='day'?1:7));loadAgenda()}
function calToday(){calDate=new Date();loadAgenda()}
function calSetView(v){calView=v;loadAgenda()}

// Colores por paciente (hash del nombre)
const patientColors=['#0D9488','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#10B981','#EF4444','#6366F1','#14B8A6','#F97316'];
function patientColor(name){let h=0;for(let i=0;i<(name||'').length;i++)h=name.charCodeAt(i)+((h<<5)-h);return patientColors[Math.abs(h)%patientColors.length]}

async function renderCalView(){
  const body=document.getElementById('calBody');
  const startHour=7,endHour=21;
  
  let dates=[];
  if(calView==='day'){
    dates=[new Date(calDate)];
  }else{
    const mon=getMonday(calDate);
    for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);dates.push(d)}
  }

  // Fetch appointments for all dates
  const todayISO=new Date().toISOString().split('T')[0];
  const allAppts=[];
  for(const d of dates){
    try{
      const _r=await apiFetch(`/api/v1/appointments?date=${fmtISO(d)}`);
      const appts=_r.data||_r;
      (Array.isArray(appts)?appts:[]).forEach(a=>a._date=fmtISO(d));
      allAppts.push(...(Array.isArray(appts)?appts:[]));
    }catch{}
  }

  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const cols=calView==='day'?'day-view':'';

  let html=`<div class="cal-week ${cols}">`;
  // Header row
  html+=`<div class="cal-week-header" style="border-right:0.5px solid var(--border)"></div>`;
  for(const d of dates){
    const iso=fmtISO(d);
    const isToday=iso===todayISO;
    html+=`<div class="cal-week-header ${isToday?'today':''}">
      ${days[d.getDay()]}<span class="day-num">${d.getDate()}</span>
    </div>`;
  }

  // Time rows
  for(let h=startHour;h<endHour;h++){
    const hh=String(h).padStart(2,'0');
    html+=`<div class="cal-time-col">${hh}:00</div>`;
    for(const d of dates){
      html+=`<div class="cal-day-col" data-date="${fmtISO(d)}" data-hour="${h}"></div>`;
    }
  }
  html+=`</div>`;
  body.innerHTML=html;

  // Place events
  for(const a of allAppts){
    const st=a.start_time||'08:00';
    const et=a.end_time||'08:30';
    const startMin=parseInt(st.substring(0,2))*60+parseInt(st.substring(3,5));
    const endMin=parseInt(et.substring(0,2))*60+parseInt(et.substring(3,5));
    const top=((startMin-startHour*60)/60)*48;
    const height=Math.max(((endMin-startMin)/60)*48,24);
    const hour=parseInt(st.substring(0,2));

    const col=body.querySelector(`.cal-day-col[data-date="${a._date}"][data-hour="${hour}"]`);
    if(!col)continue;

    const color=patientColor(a.patient_name);
    const ev=document.createElement('div');
    ev.className=`cal-event st-${a.status}`;
    ev.style.top=((startMin%60)/60)*48+'px';
    ev.style.height=height+'px';
    ev.style.borderColor=color;
    ev.innerHTML=`<div class="ev-time">${st.substring(0,5)}</div><div class="ev-name">${a.patient_name||'Paciente'}</div><div class="ev-reason">${a.reason||''}</div>`;
    ev.onclick=()=>{
      if(a.status==='confirmed')changeStatus(a.id,'checked_in');
      else if(a.status==='checked_in')changeStatus(a.id,'in_progress');
      else if(a.status==='in_progress')changeStatus(a.id,'completed');
    };
    ev.title=`${a.patient_name}\n${st.substring(0,5)}-${et.substring(0,5)}\n${a.reason||''}\nEstado: ${statusLabel(a.status)}\nClick para avanzar estado`;
    col.appendChild(ev);
  }
}

function toggleScheduleEditor(){document.getElementById('scheduleEditor').classList.toggle('hidden')}

async function saveSchedule(){
  const duration=parseInt(document.getElementById('schedDuration').value)||30;
  const checks=document.querySelectorAll('.sched-day');
  const schedules=[];
  checks.forEach(cb=>{
    if(!cb.checked) return;
    const day=parseInt(cb.dataset.day);
    const from=document.querySelector(`.sched-from[data-day="${day}"]`).value;
    const to=document.querySelector(`.sched-to[data-day="${day}"]`).value;
    if(from&&to) schedules.push({dayOfWeek:day,startTime:from,endTime:to,slotDurationMinutes:duration});
  });
  const doctorId=userData?.id||userData?.user_id;
  if(!doctorId){alert('Error: no se pudo identificar al médico');return}
  try{
    await apiFetch('/api/v1/schedules',{method:'PUT',body:{doctorId,schedules}});
    alert('✅ Horarios guardados correctamente');
    loadConfig();
  }catch(e){alert('Error: '+(e.message||'No se pudieron guardar los horarios'))}
}

async function openConvo(id,name){
  const main=document.getElementById('mainContent');
  try{
    const _msgs=await apiFetch(`/api/v1/chat/conversations/${id}/messages`);
    const msgs=_msgs.data||_msgs;
    await apiFetch(`/api/v1/chat/conversations/${id}/read`,{method:'PATCH'}).catch(()=>{});
    main.innerHTML=`
      <div class="topbar">
        <button class="btn btn-sm btn-outline" onclick="loadMensajes()" style="margin-right:12px">← Volver</button>
        <h1>${name}</h1>
      </div>
      <div class="card" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px" id="chatBox">
        ${msgs.length?msgs.map(m=>{
          const isMine=m.sender_type===userType||(userType==='doctor'&&m.sender_type==='doctor')||(userType==='patient'&&m.sender_type==='patient');
          return `<div style="align-self:${isMine?'flex-end':'flex-start'};max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;background:${isMine?'var(--primary)':'var(--bg-soft)'};color:${isMine?'#fff':'var(--text)'}">
            ${m.content}
            <div style="font-size:10px;opacity:.6;margin-top:4px;text-align:right">${m.created_at?new Date(m.created_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):''}</div>
          </div>`}).join(''):'<p class="muted center" style="padding:20px">Sin mensajes</p>'}
      </div>
      <div class="card" style="padding:12px">
        <div style="display:flex;gap:8px">
          <input id="msgInput" type="text" placeholder="Escribí un mensaje..." style="flex:1;padding:10px 14px;border:1px solid var(--text-muted);border-radius:10px;font-size:13px;outline:none" onkeydown="if(event.key==='Enter')sendMsg('${id}')">
          <button class="btn btn-primary" style="width:auto;padding:10px 20px" onclick="sendMsg('${id}')">Enviar</button>
        </div>
      </div>`;
    const box=document.getElementById('chatBox');
    if(box) box.scrollTop=box.scrollHeight;
  }catch(e){main.innerHTML=`<div class="card"><p class="error">${e.message}</p></div>`}
}

async function sendMsg(convoId){
  const inp=document.getElementById('msgInput');
  if(!inp||!inp.value.trim()) return;
  const content=inp.value.trim();
  inp.value='';
  try{
    await apiFetch('/api/v1/chat/messages',{method:'POST',body:{conversation_id:convoId,content}});
    openConvo(convoId,document.querySelector('.topbar h1')?.textContent||'');
  }catch(e){alert(e.message)}
}

async function validateAffiliate(){
  const box=document.getElementById('valResult');
  const insurer=document.getElementById('valInsurer').value.trim();
  const number=document.getElementById('valNumber').value.trim();
  if(!insurer||!number){box.innerHTML='<p class="error">Completá obra social y número</p>';return}
  box.innerHTML='<div class="spinner"></div>';
  try{
    // Resolver nombre a ID
    const resolved=await apiFetch(`/api/v1/hub/resolve?q=${encodeURIComponent(insurer)}`);
    const insurerId=resolved.id||resolved.insurer_id||(resolved.data&&resolved.data.id);
    if(!insurerId){box.innerHTML='<p class="error">No se encontró esa obra social</p>';return}

    const result=await apiFetch('/api/v1/hub/validate',{method:'POST',body:{
      insurer_id:insurerId,
      affiliate_number:number,
    }});
    const r=result.data||result;
    box.innerHTML=`
      <div style="padding:14px;border-radius:10px;background:${r.valid||r.is_valid?'#e0f7ed':'#fce8e8'};margin-top:8px">
        <strong>${r.valid||r.is_valid?'✅ Afiliado válido':'❌ Afiliado no válido'}</strong>
        ${r.affiliate_name?`<br><span>Nombre: ${r.affiliate_name}</span>`:''}
        ${r.plan?`<br><span>Plan: ${r.plan}</span>`:''}
        ${r.message?`<br><span class="muted">${r.message}</span>`:''}
      </div>`;
  }catch(e){box.innerHTML=`<p class="error">${e.message}</p>`}
}

async function selectDoctor(slug,name,specialty){
  const box=document.getElementById('bookSlots');
  const today=new Date().toISOString().split('T')[0];
  box.innerHTML='<div class="spinner"></div>';
  // Buscar slots para los próximos 5 días
  let allSlots=[];
  for(let i=0;i<5;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const dateStr=d.toISOString().split('T')[0];
    try{
      const slots=await apiFetch(`/api/v1/public/booking/${slug}/slots?date=${dateStr}`);
      const sl=slots.data||slots;
      if(sl.length) allSlots.push({date:dateStr,slots:sl});
    }catch(e){}
  }
  if(!allSlots.length){
    box.innerHTML=`<div class="card"><p class="muted center" style="padding:20px">No hay turnos disponibles en los próximos 5 días</p></div>`;
    return;
  }
  box.innerHTML=`
    <div class="card">
      <div class="card-title">🗓️ Turnos disponibles — Dr/a. ${name}</div>
      <p class="muted" style="margin-bottom:14px">${specialty}</p>
      ${allSlots.map(day=>{
        const dt=new Date(day.date+'T12:00:00');
        const dayName=dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
        return `<div style="margin-bottom:16px">
          <p style="font-weight:600;margin-bottom:8px;text-transform:capitalize">${dayName}</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${day.slots.map(s=>`<button class="btn btn-outline btn-sm" style="min-width:70px"
              onclick="confirmBooking('${slug}','${name}','${day.date}','${s.start_time||s.time||s}','${specialty}')">${(s.start_time||s.time||s+'').substring(0,5)}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

async function confirmBooking(slug,doctorName,date,time,specialty){
  const dt=new Date(date+'T12:00:00');
  const dayStr=dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  if(!confirm(`¿Confirmar turno?\n\nDr/a. ${doctorName} (${specialty})\n${dayStr} a las ${time.substring(0,5)} hs`)) return;
  try{
    const u=userData||{};
    await apiFetch(`/api/v1/public/booking/${slug}`,{method:'POST',body:{
      date,
      start_time:time,
      patient_name:(u.first_name||'')+' '+(u.last_name||''),
      patient_phone:u.phone||'',
      patient_email:u.email||'',
      reason:'Consulta',
    }});
    alert('✅ Turno reservado con éxito');
    navigateTo('mis-turnos');
  }catch(e){alert('Error: '+e.message)}
}

    main.innerHTML=`

        <div class="stat-card primary"><div class="stat-value">${total}</div><div class="stat-label">Turnos hoy</div></div>
        <div class="stat-card success"><div class="stat-value">${done}</div><div class="stat-label">Atendidos</div></div>
        <div class="stat-card cyan"><div class="stat-value">${waiting}</div><div class="stat-label">En espera</div></div>
        <div class="stat-card warning"><div class="stat-value">${rate}%</div><div class="stat-label">Tasa atención</div></div>
      </div>
      <div class="card"><div class="card-title">Turnos del día</div>
        <div class="table-wrap"><table>
          <tr><th>Hora</th><th>Paciente</th><th>Estado</th><th>Motivo</th></tr>
          ${appts.sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')).map(a=>`<tr>
            <td><strong>${a.start_time?.substring(0,5)||''}</strong></td>
            <td>${a.patient_name||'—'}</td>
            <td><span class="badge-sm ${a.status}">${statusLabel(a.status)}</span></td>
            <td class="muted">${a.reason||'—'}</td>
          </tr>`).join('')}
        </table></div>
      </div>`;
  }catch(e){main.innerHTML=`<div class="card"><p class="error">${e.message}</p></div>`}
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════

async function changeStatus(id,status){
  try{await apiFetch(`/api/v1/appointments/${id}/status`,{method:'PUT',body:{status}});navigateTo(currentSection)}catch(e){alert(e.message)}
}

function statusLabel(s){return{confirmed:'Confirmado',checked_in:'En sala',pending:'Pendiente',completed:'Atendido',cancelled:'Cancelado',in_progress:'En curso',no_show:'Ausente'}[s]||s}
function initials(name){return(name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function fmtDate(d){if(!d)return'—';const p=(d+'').substring(0,10).split('-');return`${p[2]}/${p[1]}/${p[0]}`}
function fmtDateLong(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}

// WhatsApp helpers
function waLink(phone,msg){
  const clean=(phone||'').replace(/[^0-9]/g,'');
  const num=clean.startsWith('54')?clean:'54'+clean;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
function waConfirmBtn(phone,patientName,date,time,doctorName,orgName){
  if(!phone)return '';
  const msg=`Hola ${patientName}! 👋\n\nTu turno está *confirmado*:\n📅 ${date}\n⏰ ${time} hs\n👨‍⚕️ Dr/a. ${doctorName}\n🏥 ${orgName}\n\nTe esperamos!\n— MediClick`;
  return `<a href="${waLink(phone,msg)}" target="_blank" class="btn btn-sm" style="background:#25D366;color:#fff;border:none;font-size:11px;padding:6px 10px" title="Enviar por WhatsApp">📱 WA</a>`;
}
function waReminderBtn(phone,patientName,date,time){
  if(!phone)return '';
  const msg=`Hola ${patientName}! 👋\n\nTe recordamos que tenés turno:\n📅 ${date}\n⏰ ${time} hs\n\n¿Confirmás asistencia?\n— MediClick`;
  return `<a href="${waLink(phone,msg)}" target="_blank" class="btn btn-sm" style="background:#25D366;color:#fff;border:none;font-size:11px;padding:6px 10px" title="Recordatorio WA">📱 Recordar</a>`;
}
function waSlotReleasedBtn(phone,contactName,date,time,doctorName){
  if(!phone)return '';
  const msg=`Hola ${contactName}! 👋\n\n¡Se liberó un turno!\n📅 ${date}\n⏰ ${time} hs\n👨‍⚕️ Dr/a. ${doctorName}\n\n¿Querés reservarlo? Respondé este mensaje.\n— MediClick`;
  return `<a href="${waLink(phone,msg)}" target="_blank" class="btn btn-sm" style="background:#25D366;color:#fff;border:none;font-size:11px;padding:6px 10px" title="Avisar turno libre">📱 Avisar</a>`;
}

// ─── Boot ────────────────────────────────────────────────
if(token&&userData) initApp();
</script>
