<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B241F">
<title>TusRecetasMed — Portal</title>
<meta property="og:type" content="website">
<meta property="og:title" content="TusRecetasMed — Portal profesional">
<meta property="og:description" content="Accedé al portal de gestión de tu consultorio. Turnos, pacientes, recetas y más.">
<meta property="og:site_name" content="TusRecetasMed">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#7F8F5E;--sky:#A9B98C;--primary:#2F6F62;--deep:#1F4E45;
  --bg:#F5F7F5;--bg-soft:#E9F0EC;--surface:#fff;
  --success:#1E9E74;--danger:#E0525C;--warning:#E39B1B;
  --text:#1D2925;--text-soft:#55635D;--text-muted:#97A39D;
  --radius:14px;--shadow:0 4px 20px rgba(31,78,69,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#fff;color:var(--text);padding:20px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s;border-right:1px solid #E3E9E5;overflow-y:auto}
.sidebar .brand{padding:0 20px 22px;font-size:15px;font-weight:800;letter-spacing:.1px;display:flex;align-items:center;gap:8px;color:var(--text)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2F6F62,#7F8F5E);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(47,111,98,.3)}
.brand-mark svg{width:16px;height:16px}
.sidebar .user-info{padding:12px 14px;margin:0 12px 10px;background:var(--bg);border-radius:12px}
.sidebar .user-name{font-size:14px;font-weight:700;color:var(--text)}
.sidebar .user-role{font-size:12px;color:var(--text-soft);margin-top:2px}
.nav-item{--c:#64736D;display:flex;align-items:center;gap:12px;padding:6px 12px;margin:1px 10px;font-size:14px;cursor:pointer;transition:.15s;color:#4A5852;border-radius:10px;font-weight:500}
.nav-item:hover{background:#F1F5F2;color:var(--text)}
.nav-item.active{background:#E4EFEA;color:var(--deep);font-weight:650}
.nav-item .icon{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);transition:.15s}
.nav-item .icon{color:var(--c)}
.nav-item:hover .icon{background:color-mix(in srgb,var(--c) 18%,#fff)}
.nav-item.active .icon{background:var(--c);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 35%,transparent)}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.9px;padding:16px 24px 6px;color:#A0ABA6;font-weight:700}
.nav-bottom{margin-top:auto;border-top:1px solid #E3E9E5;padding-top:8px}
.main{margin-left:240px;flex:1;padding:24px 32px;max-width:1200px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar h1{font-size:22px;font-weight:700;color:var(--text)}
.topbar .badge{background:var(--bg-soft);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid rgba(210,168,119,.06);margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(210,168,119,.06)}
.stat-value{font-size:28px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:12px;color:var(--text-soft)}
.stat-card.cyan .stat-value{color:var(--cyan)}
.stat-card.primary .stat-value{color:var(--primary)}
.stat-card.success .stat-value{color:var(--success)}
.stat-card.warning .stat-value{color:var(--warning)}
.stat-card.danger .stat-value{color:var(--danger)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid #E6EDE9}
td{padding:12px;border-bottom:1px solid #FAF6F0;vertical-align:middle}
tr:hover td{background:var(--bg-soft)}
.badge-sm{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-sm.confirmed{background:#e0f7ed;color:#0f6e56}
.badge-sm.pending{background:#fff3d9;color:#9A5B0B}
.badge-sm.completed{background:#E6EDE9;color:#5f5e5a}
.badge-sm.cancelled{background:#fce8e8;color:#993535}
.badge-sm.in_progress{background:#F5ECE1;color:#0097a7}
.badge-sm.checked_in{background:#ecfdf5;color:#10b981}
.badge-sm.no_show{background:#fce8e8;color:#71243e}
.badge-sm.waiting{background:#F5ECE1;color:#0097a7}
.badge-sm.pending_approval,.badge-sm.pending_payment{background:#fff3d9;color:#9A5B0B}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters select,.filters input{padding:9px 12px;border:1.5px solid #E3EAE6;border-radius:10px;font:inherit;font-size:13px;background:#FBFDFC;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1.5px solid #E3EAE6;background:#FBFDFC;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{background:#E9F0EC;color:var(--deep);border-radius:999px;padding:1px 8px;font-size:11px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.active .n{background:rgba(255,255,255,.25);color:#fff}
.appt-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #E6EDE9;border-radius:12px;margin-bottom:8px;background:#FBFDFC}
.appt-row .when{min-width:78px;text-align:center;border-right:1px solid #E6EDE9;padding-right:10px}
.appt-row .when b{display:block;font-size:15px;color:var(--deep)}
.appt-row .when span{font-size:11px;color:var(--text-soft);text-transform:capitalize}
.appt-row .who{flex:1;min-width:0}
.appt-row .who strong{display:block;font-size:14px}
.appt-row .who small{color:var(--text-soft);font-size:12px;display:block;line-height:1.4}
.appt-row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:360px}
.appt-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.appt-row .acts .btn{padding:7px 11px}
.btn-ok{background:#e0f7ed;color:#0f6e56;border:1px solid #9fdcc3}
.btn-no{background:#fce8e8;color:#993535;border:1px solid #f1b9b9}
.btn-soft{background:#F5ECE1;color:var(--deep);border:1px solid #E6D6C2}
.week-grid{display:grid;gap:8px}
.ficha-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ficha-foto{width:96px;height:96px;border-radius:24px;object-fit:cover;background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;flex-shrink:0;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(111,74,42,.25)}
.ficha-foto img{width:100%;height:100%;object-fit:cover}
.ficha-foto .cam{position:absolute;bottom:0;left:0;right:0;background:rgba(43,36,31,.55);font-size:10px;font-weight:600;text-align:center;padding:3px 0;opacity:0;transition:.15s}
.ficha-foto:hover .cam{opacity:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px;font-size:13px}
.kv div span{display:block;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.kv div b{font-weight:600;color:var(--text);word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#F5ECE1;color:var(--deep);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.tag.alert{background:#fce8e8;color:#993535}
details.rec{border:1px solid #E6EDE9;border-radius:12px;padding:10px 14px;margin-bottom:8px;background:#FBFDFC}
details.rec summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px;list-style:none}
details.rec summary::-webkit-details-marker{display:none}
details.rec p{font-size:13px;margin-top:6px;white-space:pre-wrap}
.who.link{cursor:pointer}.who.link strong:hover{color:var(--primary);text-decoration:underline}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.ficha-grid{grid-template-columns:1fr}}
.week-row{display:grid;grid-template-columns:28px 110px 1fr 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid #E6EDE9;border-radius:12px;background:#FBFDFC}
.week-row input[type=time]{padding:8px;border:1.5px solid #E3EAE6;border-radius:8px;font:inherit;font-size:14px;width:100%;background:#fff}
.week-row.off{opacity:.55}
.bar14{display:flex;gap:4px;align-items:flex-end;height:70px}
.bar14 div{flex:1;background:#E9F0EC;border-radius:4px 4px 0 0;position:relative;min-height:3px}
.bar14 div i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--cyan),var(--primary));border-radius:4px 4px 0 0}
@media(max-width:640px){.appt-row{flex-wrap:wrap}.appt-row .side{width:100%;max-width:none;align-items:flex-start}.appt-row .acts{justify-content:flex-start}.week-row{grid-template-columns:24px 1fr 1fr;}.week-row strong{grid-column:2/4}}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{width:100%;max-width:380px}
.login-header{text-align:center;margin-bottom:28px}
.login-header h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-header p{color:var(--text-soft);font-size:14px;margin-top:6px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:13px;font-size:14px;font-family:inherit;border:1.5px solid #E3EAE6;border-radius:12px;background:#FBFDFC;color:var(--text);outline:none;transition:.2s}
.field textarea{width:100%;padding:12px 13px;font-size:14px;font-family:inherit;border:1.5px solid #E3EAE6;border-radius:12px;background:#FBFDFC;color:var(--text);outline:none;resize:vertical;line-height:1.45}
.field textarea:focus,.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(192,138,85,.15)}
.btn{width:100%;padding:14px;font-size:14px;font-weight:700;font-family:inherit;border:none;border-radius:12px;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;box-shadow:0 6px 20px rgba(47,111,98,.25)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-outline{background:none;border:1.5px solid var(--primary);color:var(--primary)}
.btn-sm{padding:8px 16px;font-size:12px;width:auto;border-radius:8px}
.hidden{display:none!important}
.muted{color:var(--text-muted);font-size:13px}
.center{text-align:center}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.error{color:var(--danger);font-size:13px;margin-top:8px}
.flex{display:flex;gap:12px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.spinner{width:28px;height:28px;border:3px solid var(--bg-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.queue-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;transition:.15s}
.queue-item:hover{background:var(--bg-soft)}
.queue-pos{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.btn-action{border:none;background:none;cursor:pointer;padding:6px;border-radius:6px;transition:.15s}
.btn-action:hover{background:var(--bg-soft)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #E6EDE9;padding-bottom:0}
.tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-muted);transition:.15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover:not(.active){color:var(--text)}

/* Patient portal specific */
.appt-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1px solid #E6EDE9;margin-bottom:10px;transition:.15s}
.appt-card:hover{border-color:var(--cyan);background:rgba(192,138,85,.03)}
.appt-date{text-align:center;min-width:50px}
.appt-date .day{font-size:22px;font-weight:700;color:var(--primary)}
.appt-date .month{font-size:11px;color:var(--text-soft);text-transform:uppercase}
.appt-detail{flex:1}
.appt-detail .time{font-size:14px;font-weight:600}
.appt-detail .doctor{font-size:13px;color:var(--text-soft)}
.appt-detail .place{font-size:12px;color:var(--text-muted)}

/* Responsive */
@media(max-width:768px){
  /* Sidebar & layout */
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px 12px;padding-top:56px}
  .hamburger{display:block!important}

  /* Topbar */
  .topbar{flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .topbar h1{font-size:18px}

  /* Stats grid — 2 columns, smaller padding */
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-value{font-size:22px}

  /* Tables — horizontal scroll, larger touch rows */
  .table-wrap{margin:0 -12px;padding:0 12px}
  table{font-size:12px;min-width:500px}
  th{padding:8px 8px;font-size:10px}
  td{padding:10px 8px}

  /* Agenda en el celular */
  .cal-toolbar{flex-direction:column;align-items:stretch;gap:10px}
  .cal-nav-group{justify-content:space-between}
  .cal-title{font-size:16px;text-align:center;width:100%;margin:0}
  .cal-seg{flex:1}.cal-seg button{flex:1}
  .cal-legend{gap:8px;font-size:11px}

  /* Cards */
  .card{padding:14px;margin-bottom:12px;border-radius:12px}
  .card-title{font-size:13px}

  /* Nav items — bigger touch targets */
  .nav-item{padding:14px 20px;font-size:15px}

  /* Tabs */
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .tab{white-space:nowrap;padding:10px 12px;font-size:12px;flex-shrink:0}

  /* Appointment cards (patient view) */
  .appt-card{padding:12px;gap:10px}
  .appt-date .day{font-size:18px}
  .appt-detail .time{font-size:13px}

  /* Queue items */
  .queue-item{padding:8px}

  /* Buttons */
  .btn{padding:14px;font-size:15px;min-height:48px}
  .btn-sm{padding:10px 16px;font-size:13px;min-height:40px}

  /* Inline grids — stack to 1 col on mobile */
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}
  [style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:1fr !important}
  [style*="grid-template-columns:1fr 1fr auto"]{grid-template-columns:1fr !important}

  /* Flex wrapping for action buttons */
  .flex{flex-wrap:wrap}

  /* Login */
  .login-box{padding:0 8px}

  /* Avatar smaller */
  .avatar{width:32px;height:32px;font-size:12px}

  /* Overlay for sidebar */
  .overlay.open{display:block}

  /* Safe area for notched phones */
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}

/* Small phones (< 400px) */
@media(max-width:400px){
  .stats{grid-template-columns:1fr}
  .topbar h1{font-size:16px}
  .stat-value{font-size:20px}
  .main{padding:12px 8px;padding-top:52px}
}

.hamburger{display:none;position:fixed;top:16px;left:16px;z-index:60;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);-webkit-tap-highlight-color:transparent}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;-webkit-tap-highlight-color:transparent}
.overlay.open{display:block}

/* Actividad admin */
.act-bars{display:flex;gap:6px;align-items:flex-end;height:120px}
.act-bars div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%;position:relative;padding-bottom:16px}
.act-bars span{flex:1;border-radius:4px 4px 0 0;min-height:2px}.act-bars .b1,.lg.b1{background:#2F6F62}.act-bars .b2,.lg.b2{background:#3E7468}
.act-bars small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--text-muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}
/* Crecimiento */
.ahorro{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ahorro div{background:#FBFDFC;border:1px solid #F1E8DC;border-radius:12px;padding:10px}
.ahorro b{display:block;font-size:20px;color:var(--deep)}.ahorro span{font-size:12px;color:var(--text-soft)}
.ref-link{display:flex;gap:6px;margin-top:8px}.ref-link input{flex:1;min-width:0;font:inherit;font-size:12px;padding:8px;border:1.5px solid #E3EAE6;border-radius:8px;background:#FBFDFC}
/* Portal paciente */
.trat{padding:8px 0;border-bottom:1px solid #E6EDE9}.trat-i{display:flex;flex-direction:column;padding:6px 0;font-size:14px}.trat-i span{color:var(--text-soft);font-size:13px}
/* Asistente IA */
.card.dictado{background:#FBF8FF;border:1.5px dashed #D9C9EF}.card.dictado textarea{width:100%;margin-top:8px;font:inherit;font-size:13px;border:1.5px solid #E3EAE6;border-radius:10px;padding:10px;background:#fff}
.ia-box{background:linear-gradient(135deg,#FFFBF4,#F8F1FF);border:1.5px solid #E5D8F5;border-radius:14px;padding:14px;margin:6px 0 12px}
.ia-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ia-nar{font-size:14px;line-height:1.55;margin-bottom:8px}
.ia-pts{margin:0 0 6px 18px;font-size:13px;line-height:1.55}
.ia-falt{background:#FFF6E5;border:1px solid #F3D9A4;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.ia-falt ul{margin:6px 0 8px 18px}
/* Ficha unificada */
.rc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.rc-b{background:#FBFDFC;border:1px solid #F1E8DC;border-radius:12px;padding:10px 12px}
.rc-t{font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px}
.tag.prob{background:#EEF0FF;color:#3B3F8F}.tag.med{background:#E6F0EC;color:#2F5D52}
.tl-filtros{display:inline-flex;gap:4px;flex-wrap:wrap}
.tl-f{background:#F3ECE2;border:none;border-radius:16px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;color:var(--text-soft);cursor:pointer}
.tl-f.on{background:var(--primary);color:#fff}
.tl-anio{font-size:12px;font-weight:800;color:var(--text-muted);letter-spacing:.08em;margin:14px 0 6px 44px}
.tl-item{display:grid;grid-template-columns:32px 46px 1fr;gap:8px;position:relative;padding:4px 0}
.tl-item:before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:#E9F0EC}
.tl-dot{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #E9F0EC;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;z-index:1}
.tl-consulta .tl-dot{border-color:var(--primary)}.tl-receta .tl-dot{border-color:#3E7468}.tl-documento .tl-dot{border-color:#6366F1}

<div id="loginPage" class="login-wrap">

<script>
const API = window.location.origin;
let GOOGLE_CLIENT_ID = ''; // Set via env or config
let token = localStorage.getItem('mediclick_token');
let refreshToken = localStorage.getItem('mediclick_refreshToken');
let userId = localStorage.getItem('mediclick_userId');
let userType = localStorage.getItem('mediclick_userType');
let userData = JSON.parse(localStorage.getItem('mediclick_user')||'null');
let currentSection = '';
let isRefreshing = false;

// ─── Auth ────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPassword').value;
  if(!email||!pw){showLoginErr('Completá email y contraseña');return}
  const btn=document.querySelector('#loginForm button[type=submit]');
  if(btn?.disabled)return;
  if(btn){btn.disabled=true;btn.textContent='Ingresando…'}
  try{
    const r=await apiFetch('/api/v1/auth/login',{method:'POST',body:{email,password:pw}});
    saveSession(r);
    initApp();
  }catch(e){showLoginErr(e.message||'Credenciales inválidas')}
  finally{if(btn){btn.disabled=false;btn.textContent='Ingresar'}}
}

async function doRegister(){
  const fn=document.getElementById('regFN').value.trim();
  const ln=document.getElementById('regLN').value.trim();
  const em=document.getElementById('regEM').value.trim();
  const ph=document.getElementById('regPH').value.trim();
  const pw=document.getElementById('regPW').value;
  if(!fn||!ln||!em||!ph||pw.length<6){document.getElementById('regError').textContent='Completá todos los campos (contraseña mín. 6)';document.getElementById('regError').classList.remove('hidden');return}
  try{
    const r=await apiFetch('/api/v1/auth/register/patient',{method:'POST',body:{firstName:fn,lastName:ln,email:em,phone:'+54'+ph.replace(/\D/g,''),password:pw}});
    saveSession(r);initApp();
  }catch(e){document.getElementById('regError').textContent=e.message;document.getElementById('regError').classList.remove('hidden')}
}

function saveSession(r){
  token=r.accessToken;userType=r.userType;userData=r.user||r.doctor;
  if(r.refreshToken) refreshToken=r.refreshToken;
  userId=userData?.id||userData?.user_id||'';
  localStorage.setItem('mediclick_token',token);
  localStorage.setItem('mediclick_refreshToken',refreshToken);
  localStorage.setItem('mediclick_userId',userId);
  localStorage.setItem('mediclick_userType',userType);
  localStorage.setItem('mediclick_user',JSON.stringify(userData));
  if(r.organizations) localStorage.setItem('mediclick_orgs',JSON.stringify(r.organizations));
}

function logout(){localStorage.removeItem('mediclick_token');localStorage.removeItem('mediclick_refreshToken');localStorage.removeItem('mediclick_userId');localStorage.removeItem('mediclick_userType');localStorage.removeItem('mediclick_user');localStorage.removeItem('mediclick_orgs');location.reload()}

let googleIntent='patient';
function cargarGoogleConfig(){
  if(GOOGLE_CLIENT_ID) return Promise.resolve(GOOGLE_CLIENT_ID);
  return fetch(`${API}/api/v1/public/config`).then(r=>r.json()).then(c=>(GOOGLE_CLIENT_ID=c.googleClientId||''));
}
function esperarGsi(){
  return new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(t);res()}else if(++n>50){clearInterval(t);rej(new Error('gsi'))}},100)});
}
// Botón oficial de Google (One Tap solo no aparece si el usuario lo cerró antes)
async function prepararGoogle(){
  try{
    const id=await cargarGoogleConfig(); if(!id) throw new Error('sin client id');
    await esperarGsi();
    google.accounts.id.initialize({client_id:id,callback:handleGoogleResponse,ux_mode:'popup',auto_select:false});
    google.accounts.id.renderButton(document.getElementById('googleBtn'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',locale:'es',width:320});
  }catch(e){document.getElementById('googleFallback')?.classList.remove('hidden')}
}
function loginWithGoogle(intent){
  googleIntent=intent||'patient';
  cargarGoogleConfig().then(id=>{
    if(!id){showLoginErr('Google Sign-In no está configurado todavía');return}
    return esperarGsi().then(()=>{
      google.accounts.id.initialize({client_id:id,callback:handleGoogleResponse,ux_mode:'popup'});
      google.accounts.id.prompt(n=>{ if(n.isNotDisplayed?.()||n.isSkippedMoment?.()) showLoginErr(googleIntent==='doctor'?'Tocá el botón "Continuar con Google" de arriba para crear tu cuenta de profesional.':'Tocá el botón de Google de arriba.'); });
    });
  }).catch(()=>showLoginErr('No se pudo cargar Google Sign-In'));
}

async function handleGoogleResponse(response){
  try{
    const r=await apiFetch('/api/v1/auth/google',{method:'POST',body:{idToken:response.credential,intent:googleIntent}});
    saveSession(r);initApp();
  }catch(e){showLoginErr(e.message||'Error con Google Sign-In')}
}
document.addEventListener('DOMContentLoaded',prepararGoogle);
function showLoginErr(msg){const e=document.getElementById('loginError');e.textContent=msg;e.classList.remove('hidden')}
function showRegister(){document.getElementById('registerBox').classList.remove('hidden')}
function hideRegister(){document.getElementById('registerBox').classList.add('hidden')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}

// Descarga autenticada (archivos)
async function apiBlob(path){
  const headers={};
  if(token) headers['Authorization']='Bearer '+token;
  const orgs=JSON.parse(localStorage.getItem('mediclick_orgs')||'[]');
  if(orgs[0]) headers['x-organization-id']=orgs[0].org_id||orgs[0].organization_id||'';
  const r=await fetch(API+path,{headers});
  if(!r.ok){let m='No se pudo abrir el archivo';try{m=(await r.json()).message||m}catch{};throw new Error(m)}
  return r.blob();
}
// ─── API helper con auto-refresh ─────────────────────────
async function apiFetch(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;
  const orgs=JSON.parse(localStorage.getItem('mediclick_orgs')||'[]');
  if(orgs[0]) headers['x-organization-id']=orgs[0].org_id||orgs[0].organization_id||'';
  const r=await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});

  // Si el token expiró (401)
  if(r.status===401 && !isRefreshing && !path.includes('/auth/')){
    // Intentar refresh si tenemos refreshToken válido
    if(refreshToken && userId){
      isRefreshing=true;
      try{
        const rr=await fetch(API+'/api/v1/auth/refresh',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({userId,refreshToken})
        });
        if(rr.ok){
          const rd=await rr.json();
          token=rd.accessToken;
          refreshToken=rd.refreshToken||refreshToken;
          localStorage.setItem('mediclick_token',token);
          if(rd.refreshToken) localStorage.setItem('mediclick_refreshToken',rd.refreshToken);
          isRefreshing=false;
          return apiFetch(path,opts);
        }
      }catch(e){}
      isRefreshing=false;
    }
    // Si no hay refreshToken o el refresh falló → logout silencioso
    logout();
    return;
  }

  const d=await r.json();
  if(!r.ok) throw new Error(d.message||'Error');
  return d;
}

// ─── App init ────────────────────────────────────────────
function initApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appLayout').classList.remove('hidden');
  document.getElementById('userName').textContent=userData?.full_name||[userData?.first_name,userData?.last_name].filter(Boolean).join(' ')||userData?.email||'Usuario';

  const roleLabels={doctor:'Médico',patient:'Paciente',staff:'Secretaría'};
  document.getElementById('userRole').textContent=roleLabels[userType]||userType;

  buildNav();
  // Enlaces directos desde emails (ej. /portal#matricula)
  const _h=(location.hash||'').slice(1);
  navigateTo(_h&&/^[a-z-]+$/.test(_h)&&document.querySelector(`.nav-item[data-id="${_h}"]`)?_h:getDefaultSection());
  if(_h) history.replaceState(null,'',location.pathname);
  bannerApp();
}

async function bannerApp(){
  if(userType!=='doctor') return;
  try{if(localStorage.getItem('tco_banner_app')==='no')return}catch{}
  const cfg=await fetch(`${API}/api/v1/public/config`).then(r=>r.json()).catch(()=>({}));
  const d=document.createElement('div');
  d.style.cssText='position:fixed;right:18px;bottom:18px;z-index:60;max-width:330px;background:#FBFDFC;border:1px solid #E3EAE6;border-radius:16px;box-shadow:0 14px 40px rgba(111,74,42,.22);padding:16px';
  d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">📱 Tu consultorio en el celular</b><button aria-label="Cerrar" style="border:none;background:none;font-size:18px;cursor:pointer;color:#A99D90">×</button></div>
    <p style="font-size:13px;color:#55635D;margin:6px 0 12px">Para una mejor atención: agenda, sala de espera, historias clínicas y recetas desde la app, con aviso de cada turno nuevo.</p>
    ${cfg.iosAppUrl?`<a href="${cfg.iosAppUrl}" target="_blank" rel="noopener" style="display:inline-block;background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600"> Bajar en el App Store</a>`:'<span style="font-size:12px;color:#A99D90"> Muy pronto en el App Store</span>'}`;
  d.querySelector('button').onclick=()=>{d.remove();try{localStorage.setItem('tco_banner_app','no')}catch{}};
  document.body.appendChild(d);
}

  if(userType==='doctor') return 'dashboard';
  if(userType==='patient') return 'mis-turnos';

function navigateTo(id){
  currentSection=id;
  // Auto-close sidebar on mobile
  if(isMobile()){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  const main=document.getElementById('mainContent');
  main.innerHTML='<div class="spinner"></div>';

  const views={

const IMP_CAMPOS=[['','— No importar —'],['firstName','Nombre'],['lastName','Apellido'],['fullName','Nombre y apellido (juntos)'],['dni','DNI'],['phone','Celular / teléfono'],['email','Email'],['dateOfBirth','Fecha de nacimiento'],['gender','Sexo'],['insuranceProvider','Obra social / prepaga'],['insuranceNumber','N° de afiliado'],['address','Dirección'],['city','Ciudad'],['notes','Notas']];
const IMP_SIN={firstName:/^(nombres?|first ?name)$/i,lastName:/^(apellidos?|last ?name)$/i,fullName:/^(paciente|nombre y apellido|apellido y nombre|nombre completo)$/i,dni:/^(dni|documento|nro\.? ?doc|n° ?doc)/i,phone:/(cel|tel|whats|m[oó]vil|phone)/i,email:/(e-?mail|correo)/i,dateOfBirth:/(nacim|fecha.*nac|f\.? ?nac|cumple|birth)/i,gender:/^(sexo|g[eé]nero)$/i,insuranceProvider:/(obra|prepaga|cobertura|os$)/i,insuranceNumber:/(afiliado|credencial|socio|n° ?os)/i,address:/(direcci|domicilio)/i,city:/(ciudad|localidad)/i,notes:/(nota|observ)/i};

function importarPacientes(){

function impError(m){const e=document.getElementById('impErr');e.textContent=m;e.classList.remove('hidden')}
async function cargarXlsx(){
  if(window.XLSX) return window.XLSX;
  await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='/js/xlsx.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('No se pudo cargar el lector de Excel'));document.head.appendChild(sc)});
  return window.XLSX;
}
async function leerArchivoImport(f){
  if(/\.(xlsx|xls)$/i.test(f.name)){
    const X=await cargarXlsx();const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];return prepararImport(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
  }
  prepararImport(parsearTexto(await f.text()));
}
function parsearTexto(t){
  t=t.replace(/^﻿/,'');const l1=t.split(/\r?\n/)[0]||'';
  const sep=l1.includes('\t')?'\t':(l1.split(';').length>l1.split(',').length?';':',');
  const filas=[];let fila=[],cel='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cel+='"';i++}else if(c==='"')q=false;else cel+=c;continue}
    if(c==='"'){q=true;continue}
    if(c===sep){fila.push(cel);cel='';continue}
    if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;fila.push(cel);filas.push(fila);fila=[];cel='';continue}
    cel+=c}
  if(cel||fila.length){fila.push(cel);filas.push(fila)}
  return filas.filter(f=>f.some(x=>String(x).trim()));
}
function prepararImport(filas){
  if(!filas||filas.length<2) return impError('No se encontraron filas (la primera tiene que ser de títulos)');
  document.getElementById('impErr').classList.add('hidden');
  const head=filas[0].map(x=>String(x).trim());
  const map=head.map(h=>{for(const [k,re] of Object.entries(IMP_SIN)) if(re.test(h)) return k;return ''});
  // Si hay "Nombre" pero no "Apellido" y parece nombre completo, tratarlo como nombre y apellido
  if(map.includes('firstName')&&!map.includes('lastName')&&!map.includes('fullName')) map[map.indexOf('firstName')]='fullName';
  _imp={head,map,datos:filas.slice(1)};
  const prev=_imp.datos.slice(0,5);
  document.getElementById('impPaso2').innerHTML=`<div class="card"><div class="card-title">2. Revisá las columnas (${_imp.datos.length} filas)</div>
    <div class="table-wrap"><table><tr>${head.map((h,i)=>`<th><div style="font-size:11px;color:var(--text-soft);margin-bottom:4px">${esc(h||'Columna '+(i+1))}</div><select data-col="${i}" onchange="_imp.map[${i}]=this.value" style="font:inherit;font-size:12px;padding:4px;border-radius:6px;border:1px solid #E3DACC">${IMP_CAMPOS.map(([k,l])=>`<option value="${k}" ${map[i]===k?'selected':''}>${l}</option>`).join('')}</select></th>`).join('')}</tr>
      ${prev.map(f=>`<tr>${head.map((_,i)=>`<td>${esc(f[i]??'')}</td>`).join('')}</tr>`).join('')}</table></div>
    <p class="muted" style="font-size:12px;margin-top:8px">Mostramos las primeras 5 filas. Ajustá a qué dato corresponde cada columna.</p>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:12px 0"><input type="checkbox" id="impOk" style="width:18px;height:18px;accent-color:var(--primary);flex-shrink:0"> Confirmo que estoy autorizado/a a trasladar estos datos de mis pacientes a TusRecetasMed (Ley 25.326).</label>
    <button class="btn btn-primary" style="max-width:320px" id="impGo" onclick="confirmarImport()">Importar ${_imp.datos.length} pacientes</button>
    <div id="impRes"></div></div>`;
}
async function confirmarImport(){
  if(!document.getElementById('impOk').checked) return alert('Confirmá que estás autorizado/a a trasladar los datos');
  const m=_imp.map;
  if(!m.includes('fullName')&&!(m.includes('firstName')&&m.includes('lastName'))) return alert('Indicá qué columnas son el nombre y el apellido');
  const rows=_imp.datos.map(f=>{const o={};m.forEach((k,i)=>{if(k&&String(f[i]??'').trim())o[k]=String(f[i]).trim()});
    if(o.fullName){const t=o.fullName.replace(/\s+/g,' ').trim();
      if(t.includes(',')){const [a,n]=t.split(',');o.lastName=a.trim();o.firstName=(n||'').trim()}
      else{const p=t.split(' ');const apPrimero=/^apellido/i.test(_imp.head[m.indexOf('fullName')]||'');
        if(p.length===1){o.firstName=p[0];o.lastName=''}
        else if(apPrimero){o.lastName=p[0];o.firstName=p.slice(1).join(' ')}
        else{o.lastName=p[p.length-1];o.firstName=p.slice(0,-1).join(' ')}}
      delete o.fullName}
    return o});
  const b=document.getElementById('impGo');b.disabled=true;b.textContent='Importando…';
  try{
    let tot={creados:0,actualizados:0,omitidos:0,errores:[]};
    for(let i=0;i<rows.length;i+=500){const r=await apiFetch('/api/v1/patients/import',{method:'POST',body:{rows:rows.slice(i,i+500)}});
      tot.creados+=r.creados;tot.actualizados+=r.actualizados;tot.omitidos+=r.omitidos;tot.errores.push(...r.errores.map(x=>({...x,fila:x.fila+i})));b.textContent=`Importando… ${Math.min(i+500,rows.length)}/${rows.length}`}
    document.getElementById('impRes').innerHTML=`<div class="card" style="background:#EEFAF3;margin-top:12px"><b>✅ Listo</b><p style="font-size:14px;margin-top:6px">${tot.creados} pacientes nuevos · ${tot.actualizados} ya existían (se completaron datos) · ${tot.omitidos} filas vacías</p>
      ${tot.errores.length?`<p class="error" style="margin-top:6px">${tot.errores.length} filas con problemas: ${tot.errores.slice(0,10).map(x=>'fila '+x.fila+' ('+esc(x.motivo)+')').join(', ')}</p>`:''}
      <button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="navigateTo('pacientes')">Ver pacientes</button></div>`;
    b.textContent='Importado';
  }catch(e){b.disabled=false;b.textContent='Reintentar';alert(e.message)}
}

function cargarFbSdk(appId){
  if(window.FB)return Promise.resolve();
  return new Promise((ok,mal)=>{
    window.fbAsyncInit=()=>{FB.init({appId,autoLogAppEvents:true,xfbml:false,version:'v21.0'});ok()};

  });

async function conectarWa(coexistencia){
  const m=document.getElementById('waConMsg');const cfg=window._waCfg||{};
  try{
    m.textContent='Abriendo Meta…';
    await cargarFbSdk(cfg.appId);
    let sesion={};
    const onMsg=(ev)=>{
      if(!/facebook\.com$/.test(new URL(ev.origin).hostname))return;
      try{const d=typeof ev.data==='string'?JSON.parse(ev.data):ev.data;if(d?.type==='WA_EMBEDDED_SIGNUP'){if(d.event==='FINISH'||d.event==='FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING'||d.event==='FINISH_ONLY_WABA')sesion=d.data||{};else if(d.event==='CANCEL')m.textContent='Conexión cancelada.'}}catch{}
    };
    window.addEventListener('message',onMsg);
    // El SDK de Facebook exige una función común (no async) como callback
    const guardar=async(code)=>{
      m.textContent='Guardando…';
      try{
        await new Promise(r=>setTimeout(r,800)); // el aviso con el número llega justo antes o después

      window.removeEventListener('message',onMsg);
      const code=resp&&resp.authResponse&&resp.authResponse.code;
      if(!code){m.textContent='No se completó la conexión.';return}
      guardar(code);
    },{config_id:cfg.configId,response_type:'code',override_default_response_type:true,
       extras:Object.assign({setup:{},sessionInfoVersion:'3'},coexistencia?{featureType:'whatsapp_business_app_onboarding'}:{})});

}

/** Acciones según estado (sirve en dashboard y en Turnos) */
function accionesTurno(a){
  // El médico carga la consulta desde el turno (al guardar, el turno queda finalizado)
  const hc=t=>userType==='doctor'&&t.patient_id?`<button class="btn btn-sm btn-soft" onclick="abrirFormularioHC('${t.patient_id}',{appointmentId:'${t.id}',nombre:'${esc(t.patient_name||'')}'})">📋 Historia clínica</button>`:'';
  const b=(st,txt,cls)=>`<button class="btn btn-sm ${cls}" onclick="cambiarEstado('${a.id}','${st}')">${txt}</button>`;
  switch(a.status){
    case 'pending': case 'pending_approval': case 'pending_payment':
      return b('confirmed','✓ Aprobar','btn-ok')+b('cancelled','✕ Rechazar','btn-no');
    case 'confirmed': return b('checked_in','Llegó','btn-soft')+b('completed','Finalizar','btn-ok')+b('no_show','Ausente','btn-no')+b('cancelled','Cancelar','btn-no');
    case 'checked_in': return b('in_progress','▶ Atender','btn-ok')+hc(a)+b('completed','Finalizar','btn-soft');
    case 'in_progress': return hc(a)+b('completed','✓ Finalizar','btn-ok');
    case 'cancelled': case 'no_show': return b('confirmed','Reactivar','btn-soft');
    default: return '';
  }
}
function filaTurno(a){
  const f=new Date((a.date||'').slice(0,10)+'T12:00:00');

  return `<div class="appt-row">
    <div class="when"><b>${a.start_time?.slice(0,5)||''}</b><span>${f.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})}</span></div>

          <div class="card"><div class="card-title" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span>🗂️ Historia clínica</span>
            <span class="tl-filtros">${[['todo','Todo'],['consulta','Consultas'],['receta','Recetas'],['documento','Estudios'],['turno','Turnos']].map(([k,l])=>`<button class="tl-f ${k==='todo'?'on':''}" data-tl="${k}" onclick="filtrarTimeline('${k}')">${l}</button>`).join('')}</span></div>

            ${f.proximos.length?f.proximos.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #FAF6F0;font-size:13px"><span><b>${fmtDate(a.date)} ${a.start_time?.slice(0,5)||''}</b><br><small class="muted">${esc(a.reason||'')}${a.doctor_name&&(_medicos||[]).length>1?' · Dr/a. '+esc(a.doctor_name):''}</small></span><span class="badge-sm ${a.status}">${statusLabel(a.status)}</span></div>`).join(''):'<p class="muted">No tiene turnos próximos.</p>'}
          </div>
          ${!c?`<div class="card"><div class="card-title">🕑 Historial de turnos (${f.appointments.length})</div>
            ${f.appointments.length?f.appointments.slice(0,40).map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #FAF6F0;font-size:13px"><span>${fmtDate(a.date)} ${a.start_time?.slice(0,5)||''}<br><small class="muted">${esc(a.reason||'')}${a.cancelled_reason?' · '+esc(a.cancelled_reason):''}</small></span><span class="badge-sm ${a.status}">${statusLabel(a.status)}</span></div>`).join(''):'<p class="muted">Sin turnos.</p>'}

async function iaEstado(){if(!window._iaEst) window._iaEst=await apiFetch('/api/v1/ai/status').catch(()=>({modelo:false}));return window._iaEst}
window.iaEstado=iaEstado;
async function resumenIA(pid){
  const box=document.getElementById('iaResumen');if(!box)return;
  box.innerHTML='<div class="ia-box"><div class="spinner" style="margin:6px auto"></div></div>';
  try{
    const r=await apiFetch(`/api/v1/ai/patients/${pid}/summary`,{method:'POST'});
    box.innerHTML=`<div class="ia-box"><div class="ia-h"><b>✨ Resumen para leer antes de atender</b><button class="btn btn-sm btn-outline" onclick="document.getElementById('iaResumen').innerHTML=''">Cerrar</button></div>
      ${r.narrativo?`<p class="ia-nar">${esc(r.narrativo)}</p>`:''}
      <ul class="ia-pts">${r.puntos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      ${r.faltantes.length?`<div class="ia-falt"><b>Datos que faltan en la ficha (${r.faltantes.length})</b><ul>${r.faltantes.map(f=>`<li>${esc(f.texto)}</li>`).join('')}</ul>
        <div class="flex" style="gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-soft" onclick="editarResumenClinico('${pid}')">Completar resumen clínico</button><button class="btn btn-sm btn-soft" onclick="editarPaciente('${pid}')">Completar datos personales</button></div></div>`:'<p class="muted" style="font-size:12px">✓ La ficha tiene los datos principales.</p>'}
      <p class="muted" style="font-size:11px;margin-top:8px">${esc(r.aviso)} · <span id="iaFuente">Armado con los datos de la ficha</span></p></div>`;
    const est=await iaEstado();
    if(est.modelo){
      const pts=box.querySelector('.ia-pts');pts.insertAdjacentHTML('beforebegin','<p class="ia-nar muted" id="iaNar">✨ Redactando el resumen con IA (modelo local)…</p>');
      const r2=await apiFetch(`/api/v1/ai/patients/${pid}/summary?ia=1`,{method:'POST'}).catch(()=>null);
      const n=document.getElementById('iaNar');if(!n)return;
      if(r2?.narrativo){n.classList.remove('muted');n.textContent=r2.narrativo;document.getElementById('iaFuente').textContent='Redactado con IA local; revisalo'}else n.remove();
    }
  }catch(e){box.innerHTML=`<div class="ia-box"><p class="error">${esc(e.message)}</p></div>`}
}
async function indicacionesIA(pid,rid){
  const box=document.getElementById('iaInd_'+rid);if(!box)return;

    const p=window._fichaPaciente||{};
    box.innerHTML=`<div class="ia-box"><div class="ia-h"><b>✨ Indicaciones para el paciente</b><span class="muted" style="font-size:11px">${esc(r.aviso)}</span></div>
      <textarea id="iaTxt_${rid}" rows="12" style="width:100%;font:inherit;font-size:13px;border:1.5px solid #E3EAE6;border-radius:10px;padding:10px">${esc(r.texto)}</textarea>
      <div class="flex" style="gap:6px;flex-wrap:wrap;margin-top:8px">

        <button class="btn btn-sm btn-primary" onclick="compartirIndicaciones('${pid}','${rid}')">Guardar y compartir en su portal</button>

async function mejorarIndicaciones(rid){
  const b=document.getElementById('iaMej_'+rid);b.disabled=true;b.textContent='✨ Redactando… (puede tardar un minuto)';
  try{const r=await apiFetch(`/api/v1/ai/records/${rid}/instructions?ia=1`,{method:'POST'});if(r.fuente!=='reglas'){document.getElementById('iaTxt_'+rid).value=r.texto;b.textContent='✓ Redactado con IA: revisalo'}else{b.textContent='La IA no respondió; quedó el texto original'}}
  catch(e){b.textContent='No se pudo: '+e.message}

async function compartirIndicaciones(pid,rid){
  const t=document.getElementById('iaTxt_'+rid).value;
  try{await apiFetch(`/api/v1/patients/${pid}/documents`,{method:'POST',body:{title:'Indicaciones de la consulta',kind:'indicaciones',bodyText:t,medicalRecordId:rid,shared:true,studyDate:todayAR()}});abrirPaciente(pid)}catch(e){alert(e.message)}
}

// ─── Ficha clínica unificada ─────────────────────────────
function htmlResumenClinico(p,ult,vit){
  const L=x=>lista(x);
  const al=[...new Set([...L(p.allergies),...L(ult?.allergies)])], pr=L(p.chronic_conditions), me=[...new Set([...L(p.current_medications),...L(ult?.current_medications)])];
  const ant=(k,rk)=>p[k]||ult?.[rk||k]||'';
  vit=vit||{};
  const vitales=[vit.bloodPressure||vit.blood_pressure?'TA '+(vit.bloodPressure||vit.blood_pressure):'',vit.heartRate||vit.heart_rate?'FC '+(vit.heartRate||vit.heart_rate)+' lpm':'',vit.temperature?vit.temperature+' °C':'',vit.spO2||vit.spo2?'SpO₂ '+(vit.spO2||vit.spo2)+'%':'',vit.weight?vit.weight+' kg':'',vit.height?vit.height+' cm':'',vit.weight&&vit.height?'IMC '+(vit.weight/((vit.height/100)**2)).toFixed(1):''].filter(Boolean);
  const bloque=(t,items,cls)=>`<div class="rc-b"><div class="rc-t">${t}</div>${items.length?`<div class="tags">${items.map(x=>`<span class="tag ${cls||''}">${esc(x)}</span>`).join('')}</div>`:'<span class="muted" style="font-size:13px">Sin registrar</span>'}</div>`;
  return `<div class="card-title" style="justify-content:space-between"><span>🩺 Resumen clínico</span><span class="flex" style="gap:6px">${userType==='doctor'?`<button class="btn btn-sm btn-soft" onclick="resumenIA('${p.id}')">📋 Resumen del paciente</button><button class="btn btn-sm btn-outline" onclick="editarResumenClinico('${p.id}')">✏️ Editar</button>`:''}</span></div>
    <div id="iaResumen"></div>
    <div class="rc-grid">
      ${bloque('⚠️ Alergias',al,'alert')}
      ${bloque('📌 Problemas activos',pr,'prob')}
      ${bloque('💊 Medicación actual',me,'med')}
    </div>
    <div class="kv" style="margin-top:10px">
      ${kv('Antecedentes personales',ant('personal_history'))}${kv('Antecedentes quirúrgicos',p.surgical_history)}${kv('Antecedentes familiares',ant('family_history'))}${kv('Hábitos',ant('habits'))}${kv('Grupo sanguíneo',p.blood_type&&p.blood_type!=='unknown'?p.blood_type:'')}
    </div>
    ${vitales.length?`<div style="margin-top:10px"><span class="muted" style="font-size:11px;text-transform:uppercase">Últimos signos vitales${ult?.date?' ('+fmtDate(ult.date)+')':''}</span><div class="tags" style="margin-top:6px">${vitales.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`:''}
    ${p.clinical_summary_updated_at?`<p class="muted" style="font-size:11px;margin-top:8px">Actualizado el ${new Date(p.clinical_summary_updated_at).toLocaleDateString('es-AR')}</p>`:''}`;
}
function editarResumenClinico(pid){
  const p=window._fichaPaciente||{}, ult=window._ficha?.clinico?.ultimaConsulta||{};
  const L=x=>lista(x).join(', ');
  const ta=(id,l,v,ph)=>`<div class="field"><label>${l}</label><textarea id="${id}" rows="2" placeholder="${ph||''}">${esc(v||'')}</textarea></div>`;
  document.getElementById('resumenClinico').innerHTML=`<div class="card-title">🩺 Editar resumen clínico</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px">
      ${ta('rcAl','Alergias (separadas por coma)',L(p.allergies)||L(ult.allergies),'Penicilina, AINE…')}
      ${ta('rcPr','Problemas activos / condiciones crónicas',L(p.chronic_conditions),'HTA, DBT2, hipotiroidismo…')}
      ${ta('rcMe','Medicación actual',L(p.current_medications)||L(ult.current_medications),'Losartán 50 mg, Metformina 850 mg…')}
      <div class="field"><label>Grupo sanguíneo</label><select id="rcGs">${['unknown','A+','A-','B+','B-','AB+','AB-','O+','O-'].map(g=>`<option value="${g}" ${p.blood_type===g?'selected':''}>${g==='unknown'?'Sin dato':g}</option>`).join('')}</select></div>
    </div>
    ${ta('rcAp','Antecedentes personales',p.personal_history||ult.personal_history)}
    ${ta('rcAq','Antecedentes quirúrgicos',p.surgical_history)}
    ${ta('rcAf','Antecedentes familiares',p.family_history||ult.family_history)}
    ${ta('rcHa','Hábitos (tabaco, alcohol, actividad física…)',p.habits||ult.habits)}
    <p id="rcErr" class="error hidden"></p>
    <div class="flex"><button class="btn btn-sm btn-primary" onclick="guardarResumenClinico('${pid}')">Guardar</button><button class="btn btn-sm btn-outline" onclick="abrirPaciente('${pid}')">Cancelar</button></div>`;
}
async function guardarResumenClinico(pid){
  const v=id=>document.getElementById(id).value;
  try{
    await apiFetch(`/api/v1/patients/${pid}/clinical-summary`,{method:'PUT',body:{allergies:v('rcAl'),chronicConditions:v('rcPr'),currentMedications:v('rcMe'),personalHistory:v('rcAp'),surgicalHistory:v('rcAq'),familyHistory:v('rcAf'),habits:v('rcHa'),bloodType:v('rcGs')}});
    abrirPaciente(pid);
  }catch(e){const er=document.getElementById('rcErr');er.textContent=e.message;er.classList.remove('hidden')}

const TL_ICON={consulta:'🩺',receta:'💊',documento:'📎',turno:'📅'};
function htmlTimeline(f,filtro){
  const c=f.clinico||{}, p=f.patient, nombre=`${p.first_name||''} ${p.last_name||''}`.trim();
  const ev=[];
  (c.records||[]).forEach(r=>ev.push({t:'consulta',d:r.date,r}));
  (c.prescriptions||[]).forEach(r=>ev.push({t:'receta',d:r.date,r}));
  (c.documents||[]).forEach(r=>ev.push({t:'documento',d:r.date,r}));
  (f.appointments||[]).filter(a=>['completed','no_show','cancelled'].includes(a.status)).forEach(r=>ev.push({t:'turno',d:r.date,r}));
  const l=ev.filter(x=>filtro==='todo'||x.t===filtro).sort((a,b)=>String(b.d).localeCompare(String(a.d))||['consulta','receta','documento','turno'].indexOf(a.t)-['consulta','receta','documento','turno'].indexOf(b.t));
  if(!l.length) return '<p class="muted">Todavía no hay registros.</p>';
  let anio='';
  return l.map(x=>{
    const y=String(x.d).slice(0,4);const sep=y!==anio?(anio=y,`<div class="tl-anio">${y}</div>`):'';
    const r=x.r;let body='';
    if(x.t==='consulta') body=`<details class="rec"><summary><span><b>${esc(r.diagnosis||r.chief_complaint||'Consulta')}</b>${r.diagnosis_code?` <span class="muted">(${esc(r.diagnosis_code)})</span>`:''}${r.deleted_at?' <span class="badge-sm cancelled">Anulada</span>':''}</span><span class="muted">${esc(r.doctor_full_name||'')}</span></summary>
      ${r.deleted_at?`<p style="color:var(--danger);font-size:12px">Anulada${r.annulled_reason?': '+esc(r.annulled_reason):''}</p>`:''}
      <div class="flex" style="margin-top:8px;flex-wrap:wrap">${r.deleted_at?'':`<button class="btn btn-sm btn-soft" onclick="abrirFormularioHC('${p.id}',{recordId:'${r.id}',nombre:'${esc(nombre)}'})">✏️ Editar</button>`}${(r.version||1)>1?`<button class="btn btn-sm btn-soft" onclick="verVersionesHC('${r.id}')">🕑 Versiones (${r.version})</button>`:''}${r.deleted_at?'':`<button class="btn btn-sm btn-soft" onclick="indicacionesIA('${p.id}','${r.id}')">✨ Indicaciones para el paciente</button><button class="btn btn-sm btn-soft" onclick="abrirNuevaReceta({patientId:'${p.id}',medicalRecordId:'${r.id}',diagnosis:'${esc((r.diagnosis||'').replace(/'/g,''))}',diagnosisCode:'${esc(r.diagnosis_code||'')}'})">💊 Receta</button><button class="btn btn-sm btn-no" onclick="anularHC('${r.id}','${p.id}')">Anular</button>`}</div>
      ${[['Motivo',r.chief_complaint],['Enfermedad actual',r.present_illness],['Revisión por sistemas',r.systems_review],['Examen físico',r.physical_exam],['Hallazgos',r.findings],['Diagnóstico',r.diagnosis],['Plan',r.treatment_plan],['Indicaciones',r.instructions],['Seguimiento',r.follow_up]].filter(z=>z[1]).map(([k,v])=>`<p><b>${k}:</b> ${esc(String(v).replace(/; /g,'\n'))}</p>`).join('')}
      <div id="iaInd_${r.id}"></div></details>`;
    else if(x.t==='receta') body=`<div class="tl-line"><b>Receta${r.diagnosis?' · '+esc(r.diagnosis):''}</b> ${r.status==='cancelled'?'<span class="badge-sm cancelled">Anulada</span>':''}<small>${(r.items||[]).map(i=>esc([i.name,i.dosage,i.frequency].filter(Boolean).join(' '))).join(' · ')||'—'}</small>
      <div class="flex" style="margin-top:6px;flex-wrap:wrap"><button class="btn btn-sm btn-soft" onclick="recetaPdf('${r.id}')">🖨️ PDF</button><button class="btn btn-sm" style="background:#25D366;color:#fff" onclick="recetaWhatsApp('${esc(r.verification_code)}','${esc(p.phone||'')}','${esc(p.first_name||'')}')">WhatsApp</button><button class="btn btn-sm btn-soft" onclick="abrirNuevaReceta({patientId:'${p.id}'})">↻ Repetir</button></div></div>`;
    else if(x.t==='documento') body=`<div class="tl-line"><b>${esc(r.title)}</b> <span class="muted">${esc(DOC_TIPOS[r.kind]||r.kind)}</span>${r.shared_with_patient?' <span class="badge-sm confirmed">Compartido</span>':''}<small>${esc(r.description||'')}</small>
      <div class="flex" style="margin-top:6px"><button class="btn btn-sm btn-soft" onclick="verDocumento('${p.id}','${r.id}')">Ver</button></div></div>`;
    else body=`<div class="tl-line"><b>Turno ${r.start_time?.slice(0,5)||''}</b> <span class="badge-sm ${r.status}">${statusLabel(r.status)}</span><small>${esc([r.reason,r.cancelled_reason,r.doctor_name&&(_medicos||[]).length>1?'Dr/a. '+r.doctor_name:''].filter(Boolean).join(' · '))}</small></div>`;
    return `${sep}<div class="tl-item tl-${x.t}"><div class="tl-dot">${TL_ICON[x.t]}</div><div class="tl-date">${fmtDate(x.d).slice(0,5)}</div><div class="tl-body">${body}</div></div>`;
  }).join('');
}
function filtrarTimeline(k){
  document.querySelectorAll('.tl-f').forEach(b=>b.classList.toggle('on',b.dataset.tl===k));
  document.getElementById('timeline').innerHTML=htmlTimeline(window._ficha,k);
}
const DOC_TIPOS={estudio:'Estudio / laboratorio',imagen:'Imagen',informe:'Informe',indicaciones:'Indicaciones',certificado:'Certificado',otro:'Otro'};
function htmlDocumentos(p,docs){
  return `<div class="card-title" style="justify-content:space-between"><span>📎 Estudios y documentos (${docs.length})</span><button class="btn btn-sm btn-primary" onclick="formDocumento('${p.id}')">+ Agregar</button></div>
    <div id="docForm"></div>
    ${docs.length?docs.map(d=>`<div class="doc-row"><div class="doc-ic">${d.mime_type==='application/pdf'?'📄':(d.mime_type||'').startsWith('image/')?'🖼️':'📝'}</div>
      <div style="flex:1;min-width:0"><b>${esc(d.title)}</b><small>${fmtDate(d.date)} · ${esc(DOC_TIPOS[d.kind]||d.kind)}${d.size_bytes?' · '+Math.max(1,Math.round(d.size_bytes/1024))+' KB':''}</small></div>
      <div class="flex" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-sm btn-soft" onclick="verDocumento('${p.id}','${d.id}')">Ver</button>
        <label class="doc-share" title="El paciente lo ve en su portal"><input type="checkbox" ${d.shared_with_patient?'checked':''} onchange="compartirDocumento('${p.id}','${d.id}',this.checked)"> Compartir</label>
        <button class="btn btn-sm btn-no" onclick="anularDocumento('${p.id}','${d.id}')" title="Anular">✕</button>
      </div></div>`).join(''):'<p class="muted" style="font-size:13px">Subí laboratorios, imágenes, informes o escribí indicaciones. Lo que marques como compartido lo ve el paciente en su portal.</p>'}`;
}
function formDocumento(pid){
  document.getElementById('docForm').innerHTML=`<div class="doc-form">
    <div class="field"><label>Título *</label><input id="dTit" placeholder="Hemograma, Rx de tórax, Indicaciones post consulta…"></div>

async function subirFotoPaciente(id,file){
  try{
    let data='';
    if(file){
      if(!file.type.startsWith('image/')){alert('Elegí una imagen');return}
      const src=await new Promise((ok,err)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=err;fr.readAsDataURL(file)});
      const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>err(new Error('No se pudo leer la imagen (probá con JPG o PNG)'));i.src=src});
      const lado=512, r=Math.min(1,lado/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      data=cv.toDataURL('image/jpeg',0.82);
    } else if(!confirm('¿Quitar la foto?')) return;
    await apiFetch(`/api/v1/patients/${id}/photo`,{method:'PUT',body:{photo:data}});
    abrirPaciente(id);
  }catch(e){alert(e.message||'No se pudo subir la foto')}
}

function rangoFechas(){
  const h=todayAR();
  switch(turnosRango){
    case 'hoy': return {from:h,to:h};
    case 'semana': return {from:h,to:addDays(h,6)};
    case 'proximos': return {from:h,to:''};
    case 'mes': return {from:h.slice(0,8)+'01',to:''};
    case '30': return {from:addDays(h,-30),to:h};
    default: return {from:'',to:''};
  }
}
async function loadTurnos(){

      </select>
      <input type="search" placeholder="Buscar paciente, DNI o teléfono" value="${esc(turnosQ)}" onkeydown="if(event.key==='Enter'){turnosQ=this.value;loadTurnos()}" style="flex:1;min-width:180px">
    </div>
    <div class="chips" id="chips"></div>
    <div class="card" id="listaTurnos"><div class="spinner"></div></div>`;
  try{
    const [counts,lista]=await Promise.all([
      apiFetch('/api/v1/appointments/counts?'+qs({from,to,doctor_id:med})),
      apiFetch('/api/v1/appointments/list?'+qs({status:ESTADOS[turnosTab].st.join(','),from,to,doctor_id:med,q:turnosQ})),
    ]);
    const n=k=>ESTADOS[k].st.length?ESTADOS[k].st.reduce((a,x)=>a+(counts[x]||0),0):Object.values(counts).reduce((a,x)=>a+x,0);

  }catch(e){document.getElementById('listaTurnos').innerHTML=`<p class="error">${esc(e.message)}</p>`}
}

let calDate=new Date();
const isMobile=()=>window.innerWidth<=768;
let _agendaTurnos=[];

async function loadAgenda(){
  const main=document.getElementById('mainContent');
  if(isMobile()&&calView==='week') calView='day';
  main.innerHTML=buildCalToolbar()+`<div class="cal-legend">${[['confirmed','Confirmado'],['pending','Por aprobar'],['checked_in','En sala'],['in_progress','En curso'],['completed','Atendido'],['no_show','Ausente']].map(([k,l])=>`<span class="st-${k}"><i style="background:var(--st)"></i>${l}</span>`).join('')}</div><div id="calBody"><div class="spinner"></div></div>`;
  await renderCalView();
}

function buildCalToolbar(){
  const d=calDate;
  let title;
  if(calView==='day') title=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  else{const m=getMonday(d),f=new Date(m);f.setDate(f.getDate()+6);
    title=`${m.getDate()} ${m.getMonth()!==f.getMonth()?m.toLocaleDateString('es-AR',{month:'short'}):''} – ${f.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}`}
  const v=(id,l)=>`<button class="${calView===id?'on':''}" onclick="calSetView('${id}')">${l}</button>`;
  return `<div class="cal-toolbar">
    <div class="cal-nav-group">
      <button class="cal-nav-btn" onclick="calPrev()" aria-label="Anterior">◀</button>
      <button class="cal-today-btn" onclick="calToday()">Hoy</button>
      <button class="cal-nav-btn" onclick="calNext()" aria-label="Siguiente">▶</button>
      <span class="cal-title">${title}</span>
    </div>
    <div class="cal-nav-group">
      <div class="cal-seg">${v('day','Día')}${isMobile()?'':v('week','Semana')}${v('list','Lista')}</div>
      <button class="cal-nav-btn" onclick="loadAgenda()" title="Actualizar">↻</button>
    </div>
  </div>`;
}

function getMonday(d){const dt=new Date(d);const day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);return dt}
function fmtISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function calPrev(){calDate.setDate(calDate.getDate()-(calView==='day'?1:7));loadAgenda()}
function calNext(){calDate.setDate(calDate.getDate()+(calView==='day'?1:7));loadAgenda()}
function calToday(){calDate=new Date();loadAgenda()}
function calSetView(v){calView=v;try{localStorage.setItem('tc_calView',v)}catch{}loadAgenda()}
const _min=t=>{t=String(t||'00:00');return parseInt(t.slice(0,2))*60+parseInt(t.slice(3,5))};
function coberturaTxt(a){const o=a.insurance_provider||'';return !o?'':(/particular|sin obra/i.test(o)?'Particular':o)}

async function renderCalView(){
  const body=document.getElementById('calBody');
  let dates=[];
  if(calView==='day') dates=[new Date(calDate)];
  else{const mon=getMonday(calDate);for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);dates.push(d)}}
  const from=fmtISO(dates[0]),to=fmtISO(dates[dates.length-1]);
  let appts=[];
  try{appts=asList(await apiFetch(`/api/v1/appointments?from=${from}&to=${to}`))}catch(e){body.innerHTML=`<div class="card"><p class="error">${esc(e.message)}</p></div>`;return}
  appts=(Array.isArray(appts)?appts:[]).map(a=>({...a,_date:String(a.date||'').slice(0,10)})).filter(a=>a.status!=='cancelled');
  _agendaTurnos=appts;
  const todayISO=fmtISO(new Date());

  if(calView==='list'){
    const dias=calView==='list'&&dates.length===1?dates:(()=>{const m=getMonday(calDate);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d})})();
    let h='';
    for(const d of dias){
      const iso=fmtISO(d),del=appts.filter(a=>a._date===iso).sort((x,y)=>_min(x.start_time)-_min(y.start_time));
      if(!del.length&&iso!==todayISO) continue;
      h+=`<div class="agl-day"><h3>${(t=>t.charAt(0).toUpperCase()+t.slice(1))((iso===todayISO?'hoy · ':'')+d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}))}<span>${del.length} turno${del.length===1?'':'s'}</span></h3>
        ${del.map(a=>`<div class="agl st-${a.status}" onclick="verTurnoAgenda('${a.id}')" tabindex="0">
          <div class="h">${a.start_time?.slice(0,5)}<small>a ${a.end_time?.slice(0,5)||''}</small></div>
          <div class="w"><strong>${esc(a.patient_name||'Paciente')}</strong><small>${[coberturaTxt(a),a.reason,a.doctor_name&&(_medicos||[]).length>1?'Dr/a. '+a.doctor_name:''].filter(Boolean).map(esc).join(' · ')}</small></div>
          <div class="s"><span class="pill">${statusLabel(a.status)}</span></div></div>`).join('')||'<p class="muted" style="padding:6px 2px">Sin turnos</p>'}</div>`;
    }
    body.innerHTML=h||'<div class="card center" style="padding:40px"><p class="muted">No hay turnos esta semana</p></div>';
    return;
  }

  // Semana: los sábados y domingos sin turnos no ocupan lugar
  if(calView==='week') dates=dates.filter(d=>{const w=d.getDay();return (w!==0&&w!==6)||appts.some(a=>a._date===fmtISO(d))});
  const HORA=calView==='day'?144:136; // px por hora: un turno de 30 min mide ~68 px y se leen hora, estado, nombre y cobertura
  let ini=8,fin=18;
  for(const a of appts){ini=Math.min(ini,Math.floor(_min(a.start_time)/60));fin=Math.max(fin,Math.ceil(_min(a.end_time||a.start_time)/60))}
  const alto=(fin-ini)*HORA;
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  let html=`<div class="cal-grid" style="grid-template-columns:56px repeat(${dates.length},minmax(${calView==='day'?'0':'120px'},1fr))">`;
  html+=`<div class="cal-head" style="border-left:none"></div>`;
  for(const d of dates){const iso=fmtISO(d),n=appts.filter(a=>a._date===iso).length;
    html+=`<div class="cal-head ${iso===todayISO?'today':''}">${dias[d.getDay()]}<b>${d.getDate()}</b><small>${n?n+' turno'+(n===1?'':'s'):'&nbsp;'}</small></div>`}
  html+=`<div class="cal-times" style="height:${alto}px">${[...Array(fin-ini)].map((_,i)=>`<span style="top:${i*HORA}px">${String(ini+i).padStart(2,'0')}:00</span>`).join('')}</div>`;
  for(const d of dates){const iso=fmtISO(d);
    html+=`<div class="cal-col ${iso===todayISO?'today':''}" data-date="${iso}" style="height:${alto}px;background-size:100% ${HORA}px,100% ${HORA/2}px">`;
    const del=appts.filter(a=>a._date===iso).sort((x,y)=>_min(x.start_time)-_min(y.start_time)||_min(y.end_time)-_min(x.end_time));
    // Turnos superpuestos: lado a lado
    const grupos=[];let g=null,finG=-1;
    for(const a of del){const s0=_min(a.start_time),e0=Math.max(_min(a.end_time||a.start_time),s0+15);
      if(!g||s0>=finG){g=[];grupos.push(g);finG=e0}else finG=Math.max(finG,e0);
      const carriles=g.carriles||(g.carriles=[]);let c=carriles.findIndex(f=>f<=s0);if(c<0){c=carriles.length;carriles.push(0)}carriles[c]=e0;
      g.push({a,s0,e0,c})}
    for(const grupo of grupos){const n=grupo.carriles.length;
      for(const {a,s0,e0,c} of grupo){
        const top=(s0-ini*60)/60*HORA,h=Math.max((e0-s0)/60*HORA-3,26);
        const compact=h<44, multi=n>1&&(calView==='week'||isMobile()), angosto=multi||(calView==='week'&&window.innerWidth<1300), clase=(compact?'compact':(h<92?'mid':'tall'))+(multi?' narrow':'');
        const cob=coberturaTxt(a);
        html+=`<div class="cal-ev st-${a.status} ${clase}" tabindex="0" onclick="verTurnoAgenda('${a.id}')" onkeydown="if(event.key==='Enter')verTurnoAgenda('${a.id}')"
          style="top:${top+1}px;height:${h}px;left:calc(${c*100/n}% + 3px);width:calc(${100/n}% - 6px)"
          title="${esc(`${a.patient_name} · ${a.start_time?.slice(0,5)}–${a.end_time?.slice(0,5)} · ${statusLabel(a.status)}${cob?' · '+cob:''}`)}">
          <div class="t"><span>${a.start_time?.slice(0,5)}${compact||angosto?'':'–'+(a.end_time?.slice(0,5)||'')}</span>${compact||angosto?'':`<span class="pill">${statusLabel(a.status)}</span>`}</div>
          <div class="n">${a.is_first_visit?'★ ':''}${esc(a.patient_name||'Paciente')}</div>
          ${cob?`<div class="c">📇 ${esc(cob)}</div>`:''}
          ${a.reason?`<div class="r">${esc(a.reason)}</div>`:''}
        </div>`}}
    if(iso===todayISO){const now=new Date(),m=now.getHours()*60+now.getMinutes();if(m>=ini*60&&m<=fin*60)html+=`<div class="cal-now" style="top:${(m-ini*60)/60*HORA}px"></div>`}
    html+=`</div>`;
  }
  html+=`</div>`;
  if(!appts.length) html=`<p class="muted" style="margin:0 0 10px">No hay turnos ${calView==='day'?'este día':'esta semana'}.</p>`+html;
  body.innerHTML=html;
  // Llevar a la vista la hora actual o el primer turno
  const primero=body.querySelector('.cal-now')||body.querySelector('.cal-ev');
  if(primero&&calView==='day'&&isMobile()) primero.scrollIntoView({block:'center'});
}

function verTurnoAgenda(id){
  const a=_agendaTurnos.find(x=>x.id===id);if(!a)return;
  const f=new Date(a._date+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const tel=a.patient_phone||'';
  const fila=(k,v)=>v?`<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`:'';
  const cont=document.createElement('div');cont.className='ag-back';
  cont.onclick=e=>{if(e.target===cont)cont.remove()};
  cont.innerHTML=`<div class="ag-sheet st-${a.status}" role="dialog" aria-modal="true">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">${statusLabel(a.status)}</span>
      <button class="btn btn-sm btn-outline" onclick="this.closest('.ag-back').remove()" aria-label="Cerrar">✕</button></div>
    <h2>${esc(a.patient_name||'Paciente')}</h2>
    <p class="muted" style="margin-bottom:8px">${f.charAt(0).toUpperCase()+f.slice(1)} · ${a.start_time?.slice(0,5)} a ${a.end_time?.slice(0,5)||''} hs</p>
    ${fila('Cobertura',coberturaTxt(a)||'Sin dato')}
    ${fila('DNI',a.patient_dni)}
    ${fila('Celular',tel)}
    ${fila('Motivo',a.reason)}
    ${fila('Médico',a.doctor_name&&(_medicos||[]).length>1?'Dr/a. '+a.doctor_name:'')}
    ${fila('Primera vez',a.is_first_visit?'Sí':'')}
    ${a.whatsapp_reminder?fila('Recordatorio','WhatsApp 1 día antes'+(a.whatsapp_reminder_sent_at?' · enviado':'')):''}
    <div class="acts">
      ${a.patient_id?`<button class="btn btn-sm btn-primary" onclick="this.closest('.ag-back').remove();abrirPaciente('${a.patient_id}')">👤 Ver ficha</button>`:''}
      ${tel?waReminderBtn(tel,a.patient_name,f,a.start_time?.slice(0,5)):''}
    </div>
    <div class="acts" onclick="if(event.target.closest('button'))setTimeout(()=>{document.querySelector('.ag-back')?.remove()},0)">${accionesTurno(a)}</div>
  </div>`;
  document.body.appendChild(cont);
  const esc1=e=>{if(e.key==='Escape'){cont.remove();document.removeEventListener('keydown',esc1)}};document.addEventListener('keydown',esc1);
}

async function mejorarPlan(plan,btn){

async function cancelarPlan(){
  if(!confirm('¿Cancelar la renovación? Seguís con el plan hasta el final del período que ya pagaste.'))return;

  catch(e){m.textContent=e.message;m.style.color='var(--danger)'}
}

function toggleScheduleEditor(){document.getElementById('scheduleEditor').classList.toggle('hidden')}

async function saveSchedule(){
  const duration=parseInt(document.getElementById('schedDuration').value)||30;
  const checks=document.querySelectorAll('.sched-day');
  const schedules=[];
  checks.forEach(cb=>{
    if(!cb.checked) return;
    const day=parseInt(cb.dataset.day);
    const from=document.querySelector(`.sched-from[data-day="${day}"]`).value;
    const to=document.querySelector(`.sched-to[data-day="${day}"]`).value;
    if(from&&to) schedules.push({dayOfWeek:day,startTime:from,endTime:to,slotDurationMinutes:duration});
  });
  const doctorId=userData?.id||userData?.user_id;
  if(!doctorId){alert('Error: no se pudo identificar al médico');return}
  try{
    await apiFetch('/api/v1/schedules',{method:'PUT',body:{doctorId,schedules}});
    alert('✅ Horarios guardados correctamente');
    loadConfig();
  }catch(e){alert('Error: '+(e.message||'No se pudieron guardar los horarios'))}
}

  const main=document.getElementById('mainContent');
  try{

async function sendMsg(convoId){

const SSSALUD_PADRON='https://www.sssalud.gob.ar/index.php?page=bus650&user=GRAL&cat=consultas';
function escPadron(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/** Consulta al padrón oficial. Devuelve el HTML del resultado; onUsar(cobertura) agrega "Usar esta cobertura" */
async function consultarPadron(dni,sexo,patientId){
  return apiFetch('/api/v1/cobertura/consultar',{method:'POST',body:{dni,sexo,patientId}});
}
function htmlPadron(r,conUsar){
  const color={ok:'#E7F3EC',sin_cobertura:'#FFF6DF',no_encontrado:'#FFF6DF',multiple:'#FFF6DF'}[r.estado]||'#FCE8E8';
  const fecha=r.consultadoAt?new Date(r.consultadoAt).toLocaleDateString('es-AR'):'';
  let h=`<div style="padding:14px;border-radius:10px;background:${color}">`;
  if(r.estado==='ok'){
    h+=`<strong>✅ ${escPadron(r.mensaje)}</strong>${r.persona&&r.persona.apellido?`<div class="muted" style="margin-top:2px">${escPadron(r.persona.apellido)}, ${escPadron(r.persona.nombre||'')}</div>`:''}`;
    h+=r.coberturas.map((c,i)=>`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.06)">
      <div><b>${escPadron(c.nombre)}</b><div class="muted" style="font-size:12.5px">${[c.rnos?'RNOS '+escPadron(c.rnos):'',c.tipo?escPadron(c.tipo):'',c.origen?'Fuente: '+escPadron(c.origen):'',c.vigenciaDesde?'Desde '+escPadron(c.vigenciaDesde):''].filter(Boolean).join(' · ')}</div></div>
      ${conUsar?`<button class="btn btn-sm btn-primary" type="button" data-usar-cob="${i}">Usar esta cobertura</button>`:''}</div>`).join('');
  }else if(r.estado==='no_configurado'){
    h+=`<strong>La verificación automática todavía no está activa</strong><div class="muted" style="margin-top:4px">${escPadron(r.mensaje)}</div>
      <a class="btn btn-sm btn-outline" style="margin-top:10px;display:inline-block;width:auto" href="${SSSALUD_PADRON}" target="_blank" rel="noopener">Consultar en SSSalud ↗</a>`;
  }else{
    h+=`<strong>${r.estado==='error'?'⚠️ ':''}${escPadron(r.mensaje)}</strong>`;
    if(r.estado!=='multiple')h+=`<div style="margin-top:8px"><a href="${SSSALUD_PADRON}" target="_blank" rel="noopener">Consultar en SSSalud ↗</a></div>`;
  }
  h+=`<div class="muted" style="font-size:12px;margin-top:10px">${escPadron(r.fuente||'')}${fecha?' · '+fecha:''}${r.enCache?' · consulta reciente':''}. Las prepagas sin derivación de aportes no figuran en el padrón.</div></div>`;
  return h;
}
window.consultarPadron=consultarPadron;window.htmlPadron=htmlPadron;

async function validateAffiliate(){
  const box=document.getElementById('valResult');
  const dni=document.getElementById('valDni').value.replace(/\D/g,'');
  const sexo=document.getElementById('valSexo').value;
  if(dni.length<6){box.innerHTML='<p class="error">Ingresá el DNI del paciente, sin puntos</p>';return}
  box.innerHTML='<div class="spinner"></div>';
  try{ box.innerHTML=htmlPadron(await consultarPadron(dni,sexo),false); }
  catch(e){box.innerHTML=`<p class="error">${escPadron(e.message)}</p>`}
}

async function selectDoctor(slug,name,specialty){
  const box=document.getElementById('bookSlots');
  const today=new Date().toISOString().split('T')[0];
  box.innerHTML='<div class="spinner"></div>';
  // Buscar slots para los próximos 5 días
  let allSlots=[];
  for(let i=0;i<5;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const dateStr=d.toISOString().split('T')[0];
    try{
      const slots=await apiFetch(`/api/v1/public/booking/${slug}/slots?date=${dateStr}`);
      const sl=slots.data||slots;
      if(sl.length) allSlots.push({date:dateStr,slots:sl});
    }catch(e){}
  }
  if(!allSlots.length){
    box.innerHTML=`<div class="card"><p class="muted center" style="padding:20px">No hay turnos disponibles en los próximos 5 días</p></div>`;
    return;
  }
  box.innerHTML=`
    <div class="card">
      <div class="card-title">🗓️ Turnos disponibles — Dr/a. ${name}</div>
      <p class="muted" style="margin-bottom:14px">${specialty}</p>
      ${allSlots.map(day=>{
        const dt=new Date(day.date+'T12:00:00');
        const dayName=dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
        return `<div style="margin-bottom:16px">
          <p style="font-weight:600;margin-bottom:8px;text-transform:capitalize">${dayName}</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${day.slots.map(s=>`<button class="btn btn-outline btn-sm" style="min-width:70px"
              onclick="confirmBooking('${slug}','${name}','${day.date}','${s.start_time||s.time||s}','${specialty}')">${(s.start_time||s.time||s+'').substring(0,5)}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

async function confirmBooking(slug,doctorName,date,time,specialty){
  const dt=new Date(date+'T12:00:00');
  const dayStr=dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  if(!confirm(`¿Confirmar turno?\n\nDr/a. ${doctorName} (${specialty})\n${dayStr} a las ${time.substring(0,5)} hs`)) return;
  try{
    const u=userData||{};
    await apiFetch(`/api/v1/public/booking/${slug}`,{method:'POST',body:{
      date,
      start_time:time,
      patient_name:(u.first_name||'')+' '+(u.last_name||''),
      patient_phone:u.phone||'',
      patient_email:u.email||'',
      reason:'Consulta',
    }});
    alert('✅ Turno reservado con éxito');
    navigateTo('mis-turnos');
  }catch(e){alert('Error: '+e.message)}
}

async function loadMisDocumentos(){
  const main=document.getElementById('mainContent');
  try{
    const [docs,rx]=await Promise.all([apiFetch('/api/v1/me/documents').then(asList).catch(()=>[]),apiFetch('/api/v1/me/prescriptions').then(asList).catch(()=>[])]);
    const vig=rx.filter(r=>r.status!=='cancelled'&&!(r.expires_at&&new Date(r.expires_at)<new Date()));
    const ind=docs.filter(d=>d.kind==='indicaciones'), otros=docs.filter(d=>d.kind!=='indicaciones');
    window._misDocs=docs;
    main.innerHTML=`<div class="topbar"><h1>Tratamiento y estudios</h1></div>
      <div class="card"><div class="card-title">💊 Tratamiento actual</div>
        ${vig.length?vig.map(r=>`<div class="trat"><div class="muted" style="font-size:12px">Receta del ${fmtDate(r.issued_at)} · Dr/a. ${esc(r.doctor_name)}${r.expires_at?' · vigente hasta '+fmtDate(r.expires_at):''}</div>
          ${(r.items||[]).map(i=>`<div class="trat-i"><b>${esc(i.generico)}</b> ${esc(i.presentacion||'')}<span>${esc([i.dosis,i.frecuencia].filter(Boolean).join(' · '))}</span></div>`).join('')}</div>`).join(''):'<p class="muted">No tenés recetas vigentes.</p>'}
      </div>
      ${ind.length?`<div class="card"><div class="card-title">📋 Indicaciones de tu médico</div>${ind.map(d=>`<details class="rec" ${d===ind[0]?'open':''}><summary><span><b>${fmtDate(d.study_date||d.created_at)}</b> · ${esc(d.title)}</span><span class="muted">${esc(d.autor?'Dr/a. '+d.autor:d.consultorio||'')}</span></summary><p style="white-space:pre-wrap;font-size:14px;line-height:1.55">${esc(d.body_text||'')}</p></details>`).join('')}</div>`:''}
      <div class="card"><div class="card-title">📎 Estudios y documentos</div>
        ${otros.length?otros.map(d=>`<div class="doc-row"><div class="doc-ic">${d.mime_type==='application/pdf'?'📄':(d.mime_type||'').startsWith('image/')?'🖼️':'📝'}</div><div style="flex:1;min-width:0"><b>${esc(d.title)}</b><small>${fmtDate(d.study_date||d.created_at)} · ${esc(d.consultorio||'')}</small>${d.body_text?`<p style="font-size:13px;white-space:pre-wrap;margin-top:4px">${esc(d.body_text)}</p>`:''}</div>${d.mime_type?`<button class="btn btn-sm btn-primary" onclick="verMiDocumento('${d.id}')">Ver</button>`:''}</div>`).join(''):'<p class="muted">Cuando tu médico comparta estudios, informes o imágenes, los vas a ver acá.</p>'}

async function verMiDocumento(id){
  try{const w=window.open('','_blank');const url=URL.createObjectURL(await apiBlob(`/api/v1/me/documents/${id}/file`));if(w)w.location=url;else window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){alert(e.message)}
}

async function descargarMisDatos(){
  try{const d=await apiFetch('/api/v1/me/data-export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='mis-datos-tusrecetasmed.json';document.body.appendChild(a);a.click();a.remove()}catch(e){alert(e.message)}
}
async function pedirSobreMisDatos(kind){
  const det=prompt(kind==='rectificacion'?'¿Qué dato hay que corregir y cuál es el correcto?':'Contanos qué datos querés que suprimamos:','');
  if(det===null)return;
  try{const r=await apiFetch('/api/v1/me/data-requests',{method:'POST',body:{kind,detail:det}});alert(`✅ Pedido N° ${r.numero} recibido. Te respondemos antes del ${new Date(r.respondemosAntesDe).toLocaleDateString('es-AR')}.`)}catch(e){alert(e.message)}
}
