# Diagnóstico de solo lectura del servidor (se ejecuta a mano). No modifica nada.
name: Diagnóstico servidor
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Leer estado del servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null k && printf '%s\n' "$KEY" > k
          ssh -i k -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" '
            T=$(docker ps --format "{{.Names}} {{.Image}}" | grep -i traefik | head -1 | cut -d" " -f1)
            echo "TRAEFIK nombre=$T"
            docker inspect $T --format "{{range .Args}}{{println .}}{{end}}" | grep -iE "provider|entrypoint|network|constraint|cert|file" | head -8 | sed "s/^/TRAEFIK /"
            docker inspect mediclick-api --format "{{range \$k,\$v := .Config.Labels}}{{println \$k \$v}}{{end}}" | grep -i traefik | head -12 | sed "s/^/LABEL /"
            echo "LOCAL health $(docker inspect mediclick-api --format "{{if .State.Health}}{{.State.Health.Status}} {{range .State.Health.Log}}{{.ExitCode}}:{{printf \"%.80s\" .Output}}|{{end}}{{else}}sin-healthcheck{{end}}" | tr "\n" " " | head -c 400)"
            echo "LOCAL directo $(curl -s http://127.0.0.1:3100/api/v1/health | head -c 200)"
            echo "LOCAL https $(curl -sk -o /dev/null -w %{http_code} -H "Host: tuconsultorio.rispy.io" https://127.0.0.1/api/v1/health)"
            echo "LOCAL http $(curl -s -o /dev/null -w %{http_code} -H "Host: tuconsultorio.rispy.io" http://127.0.0.1/api/v1/health)"
            echo "BACKUP cron=$(crontab -l 2>/dev/null | grep -c backup-diario) timer=$(systemctl is-active tuconsultorio-backup.timer 2>/dev/null) crontab=$(command -v crontab || echo no) ultimo=$(ls -t /opt/mediclick/backups/*.sql.gz 2>/dev/null | head -1 | xargs -r stat -c %y | cut -c1-16) cantidad=$(ls /opt/mediclick/backups/*.sql.gz 2>/dev/null | wc -l)"
            echo "SERVIDOR $(curl -s --max-time 5 ipinfo.io/country 2>/dev/null) $(curl -s --max-time 5 ipinfo.io/city 2>/dev/null)"
            echo "LOCAL api.rispy.io https $(curl -sk -o /dev/null -w %{http_code} -H "Host: api.rispy.io" https://127.0.0.1/health)"
            cd /opt/mediclick 2>/dev/null && echo "INV archivos $(ls -A | tr "\n" " " | head -c 300)"
            echo "INV servicios $(docker compose -f $(ls docker-compose.yml compose.yaml compose.yml 2>/dev/null | head -1) config --services 2>/dev/null | tr "\n" " ")"
            echo "INV contenedores $(docker ps --format "{{.Names}}" | tr "\n" " " | head -c 400)"
            echo "INV volumenes-mediclick $(docker inspect mediclick-api mediclick-db --format "{{.Name}}:{{range .Mounts}}{{.Type}}={{.Source}}>{{.Destination}} {{end}}" 2>/dev/null | tr "\n" " " | head -c 400)"
            echo "INV tam-db $(docker exec mediclick-db sh -c "du -sh /var/lib/postgresql/data" 2>/dev/null | cut -f1) env-keys=$(grep -oE "^[A-Z_]+=" .env 2>/dev/null | tr -d = | tr "\n" "," | head -c 400)"
            DBU=$(docker exec mediclick-db printenv POSTGRES_USER); DBN=$(docker exec mediclick-db printenv POSTGRES_DB)
            echo  | base64 -d | docker exec -i mediclick-db psql -U "$DBU" -d "$DBN" -At 2>&1 | head -5 | sed "s/^/ACT /"
            echo "WA appid=$(docker exec mediclick-api printenv META_APP_ID 2>/dev/null | grep -c .) configid=$(docker exec mediclick-api printenv META_ES_CONFIG_ID 2>/dev/null | grep -c .) cuentas=$(docker exec mediclick-db psql -U "$DBU" -d "$DBN" -Atc "select count(*) from doctor_whatsapp_accounts" 2>/dev/null) verify=$(docker exec mediclick-api printenv WHATSAPP_VERIFY_TOKEN >/dev/null 2>&1 && echo si || echo no) secret=$(docker exec mediclick-api printenv META_APP_SECRET >/dev/null 2>&1 && echo si || echo no) token=$(docker exec mediclick-api printenv WHATSAPP_TOKEN >/dev/null 2>&1 && echo si || echo no) phoneid=$(docker exec mediclick-api printenv WHATSAPP_PHONE_NUMBER_ID >/dev/null 2>&1 && echo si || echo no) eventos=$(docker exec mediclick-db psql -U "$DBU" -d "$DBN" -Atc "select count(*) from whatsapp_events" 2>/dev/null) get=$(curl -s -o /dev/null -w %{http_code} "http://127.0.0.1:3100/api/v1/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=x&hub.challenge=1")"
            echo "PUSH env keyid=$(docker exec mediclick-api printenv APNS_KEY_ID >/dev/null 2>&1 && echo si || echo no) teamid=$(docker exec mediclick-api printenv APNS_TEAM_ID >/dev/null 2>&1 && echo si || echo no) keyinline=$(docker exec mediclick-api printenv APNS_KEY >/dev/null 2>&1 && echo si || echo no) archivo=$(docker exec mediclick-api sh -c "test -s /app/apns-key.p8 && echo si || echo no" 2>/dev/null) entorno=$(docker exec mediclick-api printenv APNS_ENVIRONMENT 2>/dev/null) bundle=$(docker exec mediclick-api printenv APNS_BUNDLE_ID 2>/dev/null)"
            echo  | base64 -d | docker exec -i mediclick-db psql -U "$DBU" -d "$DBN" -At 2>&1 | head -3 | sed "s/^/PUSH /"
            docker logs --since 72h mediclick-api 2>&1 | grep -iE "apns|push" | tail -3 | cut -c1-160 | sed "s/^/PUSH log /"
            echo "ACT smtp=$(docker exec mediclick-api printenv SMTP_HOST >/dev/null 2>&1 && echo si || echo no)"
            echo "ACT landing-shot $(curl -sk -o /dev/null -w "%{http_code} %{content_type} %{size_download}" -H "Host: rispy.io" https://127.0.0.1/shots/inbox.webp)"
            echo "OLL desde-api $(docker exec mediclick-api node -e "fetch(\"http://rispy-ollama:11434/api/tags\").then(r=>r.json()).then(j=>console.log(\"ok\",j.models.map(m=>m.name).join(\",\"))).catch(e=>console.log(\"error\",e.message))" 2>&1 | head -c 200)"
            echo "OLL redes $(docker inspect rispy-ollama --format "{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" 2>/dev/null)"
            echo "OLL modelos $(docker exec rispy-ollama ollama list 2>/dev/null | tail -n +2 | awk "{print \$1, \$3\$4}" | tr "\n" ";")"
            echo "OLL recursos $(docker stats --no-stream --format "{{.Name}}={{.MemUsage}} cpu {{.CPUPerc}}" rispy-ollama mediclick-api 2>/dev/null | tr "\n" ";") total=$(free -m | awk "/Mem/ {print \$2\"MB usados \"\$3}") cpus=$(nproc)"
            echo "INV google $(curl -s http://127.0.0.1:3100/api/v1/public/config | grep -o "googleClientId[^,]*")"
            echo "PUERTOS 3100-bloqueado=$(iptables -C DOCKER-USER -p tcp -m conntrack --ctorigdstport 3100 --ctdir ORIGINAL -j DROP 2>/dev/null && echo si || echo no) publicos $(ss -tlnH 2>/dev/null | awk "{print \$4}" | grep -vE "^(127\.|\[::1\])" | sed "s/.*://" | sort -un | tr "\n" " ") | docker $(docker ps --format "{{.Names}}={{.Ports}}" | grep -E "0\.0\.0\.0|:::" | sed -E "s/(0\.0\.0\.0|\[?::\]?):([0-9]+)->[0-9]+\/tcp/\2/g; s/, /,/g" | tr "\n" " " | head -c 300)"
            echo "CAP host load=$(cut -d" " -f1-3 /proc/loadavg) ram=$(free -m | awk "/Mem/ {print \$3\"/\"\$2\"MB\"}") swap=$(free -m | awk "/Swap/ {print \$3\"MB\"}") disco=$(df -h / | awk "NR==2 {print \$5\" de \"\$2}") contenedores=$(docker ps -q | wc -l)"
            echo "CAP top $(docker stats --no-stream --format "{{.CPUPerc}} {{.MemUsage}} {{.Name}}" 2>/dev/null | sort -rn | head -6 | awk "{print \$4\"=\"\$1\"/\"\$2}" | tr "\n" " ")"
            echo "CAP rispy colas $(docker exec rispy-rabbitmq rabbitmqctl -q list_queues name messages consumers 2>/dev/null | awk "\$2>0 || \$3==0 {print \$1\"=\"\$2\"msg/\"\$3\"cons\"}" | tr "\n" " " | head -c 300) backups-rispy=$(ls /opt/rispy-infra/backups/rispy_*.sql.gz 2>/dev/null | wc -l) logs=$(du -sh /var/lib/docker/containers 2>/dev/null | cut -f1)"
            echo "WA2 plantilla=$(docker exec mediclick-api printenv WHATSAPP_TEMPLATE 2>/dev/null | grep -c .) plantilla-confirm=$(docker exec mediclick-api printenv WHATSAPP_TEMPLATE_CONFIRM 2>/dev/null | grep -c .) lang=$(docker exec mediclick-api printenv WHATSAPP_TEMPLATE_LANG 2>/dev/null)"
            echo "WA2 token-meta $(docker exec mediclick-api node -e "fetch(\"https://graph.facebook.com/v21.0/\"+process.env.WHATSAPP_PHONE_NUMBER_ID+\"?fields=quality_rating,code_verification_status\",{headers:{Authorization:\"Bearer \"+process.env.WHATSAPP_TOKEN}}).then(async r=>console.log(r.status,(await r.text()).replace(/[0-9]{6,}/g,\"#\").slice(0,220))).catch(e=>console.log(\"error\",e.message))" 2>&1 | head -c 300)"
            echo "WA2 central $(echo  | base64 -d | docker exec -i mediclick-api node 2>&1 | head -c 600)"
            echo  | base64 -d | docker exec -i mediclick-db psql -U "$DBU" -d "$DBN" -At 2>&1 | head -4 | sed "s/^/WA2 /"
            echo "PAGO env mp_token=$(docker exec mediclick-api printenv MP_ACCESS_TOKEN 2>/dev/null | grep -c .) mp_public=$(docker exec mediclick-api printenv MP_PUBLIC_KEY 2>/dev/null | grep -c .)"
            echo  | base64 -d | docker exec -i mediclick-api node 2>&1 | head -c 300
            echo "" | base64 -d | docker exec -i mediclick-db psql -U "$DBU" -d "$DBN" -At 2>&1 | head -12
            echo "RES cpus=$(nproc) mem=$(free -m | awk "/Mem:/{print \$2\"MB usados=\"\$3\"MB\"}") disco=$(df -h / | awk "NR==2{print \$2\" usado \"\$5}") carga=$(cut -d\" \" -f1-3 /proc/loadavg) contenedores=$(docker ps -q | wc -l)"
            echo "RES db_tamano=$(docker exec mediclick-db psql -U "$DBU" -d "$DBN" -Atc "select pg_size_pretty(pg_database_size(current_database()))") conexiones=$(docker exec mediclick-db psql -U "$DBU" -d "$DBN" -Atc "select count(*) from pg_stat_activity") max_conn=$(docker exec mediclick-db psql -U "$DBU" -d "$DBN" -Atc "show max_connections")"
            docker stats --no-stream --format "RES {{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}" | head -12
            docker logs --since 96h mediclick-api 2>&1 | grep -iE "WhatsApp|Número central|hello_world|recordatorio|whatsapp-reminder" | sed -E "s/[0-9]{6,}/#/g" | tail -12 | cut -c1-260 | sed "s/^/WA2 log /"
          ' > out.txt 2>&1 || true
          echo "PUBKEY $(ssh-keygen -y -f k 2>/dev/null)" >> out.txt
          for d in tusrecetasmed.com www.tusrecetasmed.com; do echo "DOMINIO $d dns=$(dig +short $d A | tr "\n" , ) https=$(curl -s -m 10 -o /dev/null -w %{http_code} https://$d/api/v1/health || true) cert=$(echo | timeout 8 openssl s_client -connect $d:443 -servername $d 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null | tr "\n" " " | head -c 160)" >> out.txt; done
          echo "DOMINIO es-nuestro=$(curl -s -m 10 https://tusrecetasmed.com/api/v1/health | grep -c mediclick-api) ns=$(dig +short NS tusrecetasmed.com | tr "\n" ,) apunta-al-vps=$( [ "$(dig +short tusrecetasmed.com A | tail -1)" = "$(dig +short $HOST A | tail -1)" ] || [ "$(dig +short tusrecetasmed.com A | tail -1)" = "$HOST" ] && echo si || echo no)" >> out.txt
          echo "DOMINIO reserva $(curl -s -m 10 -o /dev/null -w "%{http_code} %{size_download}" https://tusrecetasmed.com/reservar.html || true) viejo $(curl -s -m 10 -o /dev/null -w "%{http_code} %{redirect_url}" https://tuconsultorio.rispy.io/portal || true) rispy.io-sin-salud=$(curl -s -m 10 https://rispy.io/ | grep -c -i "consultorio" )" >> out.txt
          echo "PUERTOS desde-internet 3100=$(curl -s -m 8 -o /dev/null -w %{http_code} http://$HOST:3100/api/v1/health || true) 5432=$(timeout 5 bash -c "</dev/tcp/$HOST/5432" 2>/dev/null && echo ABIERTO || echo cerrado) 6379=$(timeout 5 bash -c "</dev/tcp/$HOST/6379" 2>/dev/null && echo ABIERTO || echo cerrado)" >> out.txt
          { grep -E '^(RES|PAGO)' out.txt; } | while IFS= read -r l; do echo "::notice::$l"; done
          rm -f k
