# Diagnóstico de solo lectura del servidor (se ejecuta a mano). No modifica nada.
name: Diagnóstico servidor
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Leer estado del servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null k && printf '%s\n' "$KEY" > k
          ssh -i k -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" '
            echo "HOST $(hostname) IP $(curl -s -4 ifconfig.me)"
            docker ps --format "{{.Names}} | {{.Ports}} | {{.Networks}}" | sed "s/^/PS /"
            ls /opt | sed "s/^/OPT /"
            for c in $(docker ps --format "{{.Names}}" | grep -i traefik); do echo "TRAEFIK $c $(docker inspect $c --format "{{join .Args \" \"}}" | head -c 600)"; done
          ' > out.txt 2>&1 || true
          rm -f k
          grep -E '^(HOST|PS|OPT|TRAEFIK)' out.txt | head -48 | while IFS= read -r l; do echo "::notice::$l"; done
