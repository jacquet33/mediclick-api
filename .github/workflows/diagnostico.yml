# Diagnóstico de solo lectura del servidor (se ejecuta a mano). No modifica nada.
name: Diagnóstico servidor
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Leer estado del servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null k && printf '%s\n' "$KEY" > k
          ssh -i k -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" '
            T=$(docker ps --format "{{.Names}} {{.Image}}" | grep -i traefik | head -1 | cut -d" " -f1)
            echo "TRAEFIK nombre=$T"
            docker inspect $T --format "{{range .Args}}{{println .}}{{end}}" | grep -iE "provider|entrypoint|network|constraint|cert|file" | head -8 | sed "s/^/TRAEFIK /"
            docker inspect mediclick-api --format "{{range \$k,\$v := .Config.Labels}}{{println \$k \$v}}{{end}}" | grep -i traefik | head -12 | sed "s/^/LABEL /"
            echo "LOCAL health $(docker inspect mediclick-api --format "{{if .State.Health}}{{.State.Health.Status}} {{range .State.Health.Log}}{{.ExitCode}}:{{printf \"%.80s\" .Output}}|{{end}}{{else}}sin-healthcheck{{end}}" | tr "\n" " " | head -c 400)"
            echo "LOCAL directo $(curl -s http://127.0.0.1:3100/api/v1/health | head -c 200)"
            echo "LOCAL https $(curl -sk -o /dev/null -w %{http_code} -H "Host: tuconsultorio.rispy.io" https://127.0.0.1/api/v1/health)"
            echo "LOCAL http $(curl -s -o /dev/null -w %{http_code} -H "Host: tuconsultorio.rispy.io" http://127.0.0.1/api/v1/health)"
            echo "BACKUP cron=$(crontab -l 2>/dev/null | grep -c backup-diario) timer=$(systemctl is-active tuconsultorio-backup.timer 2>/dev/null) crontab=$(command -v crontab || echo no) ultimo=$(ls -t /opt/mediclick/backups/*.sql.gz 2>/dev/null | head -1 | xargs -r stat -c %y | cut -c1-16) cantidad=$(ls /opt/mediclick/backups/*.sql.gz 2>/dev/null | wc -l)"
            echo "SERVIDOR $(curl -s --max-time 5 ipinfo.io/country 2>/dev/null) $(curl -s --max-time 5 ipinfo.io/city 2>/dev/null)"
            echo "LOCAL api.rispy.io https $(curl -sk -o /dev/null -w %{http_code} -H "Host: api.rispy.io" https://127.0.0.1/health)"
            cd /opt/mediclick 2>/dev/null && echo "INV archivos $(ls -A | tr "\n" " " | head -c 300)"
            echo "INV servicios $(docker compose -f $(ls docker-compose.yml compose.yaml compose.yml 2>/dev/null | head -1) config --services 2>/dev/null | tr "\n" " ")"
            echo "INV contenedores $(docker ps --format "{{.Names}}" | tr "\n" " " | head -c 400)"
            echo "INV volumenes-mediclick $(docker inspect mediclick-api mediclick-db --format "{{.Name}}:{{range .Mounts}}{{.Type}}={{.Source}}>{{.Destination}} {{end}}" 2>/dev/null | tr "\n" " " | head -c 400)"
            echo "INV tam-db $(docker exec mediclick-db sh -c "du -sh /var/lib/postgresql/data" 2>/dev/null | cut -f1) env-keys=$(grep -oE "^[A-Z_]+=" .env 2>/dev/null | tr -d = | tr "\n" "," | head -c 400)"
            DBU=$(docker exec mediclick-db printenv POSTGRES_USER); DBN=$(docker exec mediclick-db printenv POSTGRES_DB)
            echo  | base64 -d | docker exec -i mediclick-db psql -U "$DBU" -d "$DBN" -At 2>&1 | head -5 | sed "s/^/ACT /"
            echo "ACT smtp=$(docker exec mediclick-api printenv SMTP_HOST >/dev/null 2>&1 && echo si || echo no)"
            echo "ACT landing-shot $(curl -sk -o /dev/null -w "%{http_code} %{content_type} %{size_download}" -H "Host: rispy.io" https://127.0.0.1/shots/inbox.webp)"
            echo "OLL desde-api $(docker exec mediclick-api node -e "fetch(\"http://rispy-ollama:11434/api/tags\").then(r=>r.json()).then(j=>console.log(\"ok\",j.models.map(m=>m.name).join(\",\"))).catch(e=>console.log(\"error\",e.message))" 2>&1 | head -c 200)"
            echo "OLL redes $(docker inspect rispy-ollama --format "{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" 2>/dev/null)"
            echo "OLL modelos $(docker exec rispy-ollama ollama list 2>/dev/null | tail -n +2 | awk "{print \$1, \$3\$4}" | tr "\n" ";")"
            echo "OLL recursos $(docker stats --no-stream --format "{{.Name}}={{.MemUsage}} cpu {{.CPUPerc}}" rispy-ollama mediclick-api 2>/dev/null | tr "\n" ";") total=$(free -m | awk "/Mem/ {print \$2\"MB usados \"\$3}") cpus=$(nproc)"
            echo "INV google $(curl -s http://127.0.0.1:3100/api/v1/public/config | grep -o "googleClientId[^,]*")"
            echo "PUERTOS publicos $(ss -tlnH 2>/dev/null | awk "{print \$4}" | grep -vE "^(127\.|\[::1\])" | sed "s/.*://" | sort -un | tr "\n" " ") | docker $(docker ps --format "{{.Names}}={{.Ports}}" | grep -E "0\.0\.0\.0|:::" | sed -E "s/(0\.0\.0\.0|\[?::\]?):([0-9]+)->[0-9]+\/tcp/\2/g; s/, /,/g" | tr "\n" " " | head -c 300)"
            echo "CAP host load=$(cut -d" " -f1-3 /proc/loadavg) ram=$(free -m | awk "/Mem/ {print \$3\"/\"\$2\"MB\"}") swap=$(free -m | awk "/Swap/ {print \$3\"MB\"}") disco=$(df -h / | awk "NR==2 {print \$5\" de \"\$2}") contenedores=$(docker ps -q | wc -l)"
            echo "CAP top $(docker stats --no-stream --format "{{.CPUPerc}} {{.MemUsage}} {{.Name}}" 2>/dev/null | sort -rn | head -6 | awk "{print \$4\"=\"\$1\"/\"\$2}" | tr "\n" " ")"
            echo "CAP rispy colas $(docker exec rispy-rabbitmq rabbitmqctl -q list_queues name messages consumers 2>/dev/null | awk "\$2>0 || \$3==0 {print \$1\"=\"\$2\"msg/\"\$3\"cons\"}" | tr "\n" " " | head -c 300) backups-rispy=$(ls /opt/rispy*/backups 2>/dev/null | wc -l) logs=$(du -sh /var/lib/docker/containers 2>/dev/null | cut -f1)"
          ' > out.txt 2>&1 || true
          echo "PUBKEY $(ssh-keygen -y -f k 2>/dev/null)" >> out.txt
          { grep -E '^(PUERTOS|CAP|LOCAL directo)' out.txt; grep -E '^ACT' out.txt | head -3; } | while IFS= read -r l; do echo "::notice::$l"; done
          rm -f k
