# Certificado de ARCA para facturación electrónica (WSFE). La clave privada se genera y queda SOLO en el
# servidor (/opt/arca, compartido por TusRecetasMed y Rispy: mismo CUIT). El CSR y el certificado son públicos.
#  - accion=csr: genera la clave (si no existe) y muestra el CSR para subirlo en ARCA
#  - accion=certificado: guarda el certificado .crt que devuelve ARCA (pegado en "certificado")
name: ARCA certificado
on:
  workflow_dispatch:
    inputs:
      accion:
        description: csr | certificado
        required: true
        default: csr
      certificado:
        description: Contenido del .crt de ARCA (solo para accion=certificado)
        required: false
jobs:
  arca:
    runs-on: ubuntu-latest
    steps:
      - name: Certificado en el servidor
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          ACCION: ${{ github.event.inputs.accion }}
          CRT: ${{ github.event.inputs.certificado }}
        run: |
          install -m 600 /dev/null k && printf '%s\n' "$KEY" > k
          CRT_B64=$(printf '%s' "$CRT" | base64 -w0)
          ssh -i k -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" "ACCION='$ACCION' CRT_B64='$CRT_B64' sh -s" <<'SH'
            set -e
            mkdir -p /opt/arca && chmod 700 /opt/arca
            if [ "$ACCION" = "csr" ]; then
              [ -s /opt/arca/arca.key ] || (umask 077 && openssl genrsa -out /opt/arca/arca.key 2048 2>/dev/null)
              chmod 600 /opt/arca/arca.key
              openssl req -new -key /opt/arca/arca.key -subj "/C=AR/O=Alejandro Emanuel Jacquet/CN=tusrecetasmed/serialNumber=CUIT 20347844803" -out /opt/arca/arca.csr
              echo "CSR-INICIO"; cat /opt/arca/arca.csr; echo "CSR-FIN"
            elif [ "$ACCION" = "certificado" ]; then
              printf '%s' "$CRT_B64" | base64 -d > /opt/arca/arca.crt.tmp
              openssl x509 -in /opt/arca/arca.crt.tmp -noout -subject -enddate
              K=$(openssl rsa -in /opt/arca/arca.key -noout -modulus | md5sum); C=$(openssl x509 -in /opt/arca/arca.crt.tmp -noout -modulus | md5sum)
              [ "$K" = "$C" ] || { echo "El certificado no corresponde a la clave del servidor"; rm -f /opt/arca/arca.crt.tmp; exit 1; }
              mv /opt/arca/arca.crt.tmp /opt/arca/arca.crt && chmod 644 /opt/arca/arca.crt && echo "CERTIFICADO GUARDADO"
            fi
          SH
