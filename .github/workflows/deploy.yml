name: Build & Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mediclick-api

jobs:
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/mediclick
            # Rispy Health: la API también responde en tuconsultorio.rispy.io a través del proxy de Rispy
            # (se suma al dominio actual; no lo reemplaza). Archivo propio, no pisa ningún override existente.
            cat > docker-compose.rispy.yml <<'YAML'
            services:
              api:
                # localhost resuelve a IPv6 (::1) y la API escucha en IPv4: el chequeo fallaba y el proxy ignoraba el contenedor
                healthcheck:
                  test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                environment:
                  # ID de cliente OAuth web de Google (es público, no es secreto). Variable del repo GOOGLE_CLIENT_ID_WEB
                  GOOGLE_CLIENT_ID_WEB: "${{ vars.GOOGLE_CLIENT_ID_WEB }}"
                  # Links de recetas, pagos y correos con el dominio nuevo
                  BASE_URL: "https://tuconsultorio.rispy.io"
                  API_BASE_URL: "https://tuconsultorio.rispy.io"
                networks:
                  - mediclick-net
                  - traefik-public
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.rispy-health.rule=Host(`tuconsultorio.rispy.io`)"
                  - "traefik.http.routers.rispy-health.entrypoints=websecure"
                  - "traefik.http.routers.rispy-health.tls=true"
                  - "traefik.http.routers.rispy-health.tls.certresolver=letsencrypt"
                  - "traefik.http.services.rispy-health.loadbalancer.server.port=3000"
                  - "traefik.docker.network=traefik-public"
            networks:
              traefik-public:
                external: true
            YAML
            BASE=$(ls docker-compose.yml compose.yaml compose.yml 2>/dev/null | head -1)
            FILES="-f $BASE"
            [ -f docker-compose.override.yml ] && FILES="$FILES -f docker-compose.override.yml"
            FILES="$FILES -f docker-compose.rispy.yml"
            docker compose $FILES pull api
            docker compose $FILES up -d --force-recreate --no-deps api
            docker image prune -f
            sleep 8
            curl -sf http://localhost:3100/api/v1/health && echo "API OK" || echo "API WARN"
