name: Build & Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mediclick-api

jobs:
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/mediclick
            # Rispy Health: la API también responde en tuconsultorio.rispy.io a través del proxy de Rispy
            # (se suma al dominio actual; no lo reemplaza). Archivo propio, no pisa ningún override existente.
            cat > docker-compose.rispy.yml <<'YAML'
            services:
              api:
                # localhost resuelve a IPv6 (::1) y la API escucha en IPv4: el chequeo fallaba y el proxy ignoraba el contenedor
                healthcheck:
                  test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                environment:
                  # ID de cliente OAuth web de Google (es público, no es secreto). Variable del repo GOOGLE_CLIENT_ID_WEB
                  GOOGLE_CLIENT_ID_WEB: "${{ vars.GOOGLE_CLIENT_ID_WEB }}"
                  # Links de recetas, pagos y correos con el dominio nuevo
                  BASE_URL: "https://tuconsultorio.rispy.io"
                  API_BASE_URL: "https://tuconsultorio.rispy.io"
                  # Verificación de médicos y firma de recetas (secretos del repo; vacíos = revisión manual)
                  PLATFORM_ADMIN_EMAILS: "${{ secrets.PLATFORM_ADMIN_EMAILS }}"
                  SISA_USUARIO: "${{ secrets.SISA_USUARIO }}"
                  SISA_CLAVE: "${{ secrets.SISA_CLAVE }}"
                  RENAPDIS_PLATFORM_ID: "${{ vars.RENAPDIS_PLATFORM_ID }}"
                  RENAPDIS_REPOSITORY_ID: "${{ vars.RENAPDIS_REPOSITORY_ID }}"
                  CUIR_TIPO_MEDICAMENTO: "${{ vars.CUIR_TIPO_MEDICAMENTO }}"
                  MSAL_REPO_URL: "${{ vars.MSAL_REPO_URL }}"
                  MSAL_REPO_TOKEN: "${{ secrets.MSAL_REPO_TOKEN }}"
                  IOS_APP_STORE_URL: "${{ vars.IOS_APP_STORE_URL }}"
                networks:
                  - mediclick-net
                  - traefik-public
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.rispy-health.rule=Host(`tuconsultorio.rispy.io`)"
                  - "traefik.http.routers.rispy-health.entrypoints=websecure"
                  - "traefik.http.routers.rispy-health.tls=true"
                  - "traefik.http.routers.rispy-health.tls.certresolver=letsencrypt"
                  - "traefik.http.services.rispy-health.loadbalancer.server.port=3000"
                  # medicos.rispy.io (alta de médicos): router aparte para que su certificado no afecte al de tuconsultorio
                  - "traefik.http.routers.rispy-medicos.rule=Host(`medicos.rispy.io`)"
                  - "traefik.http.routers.rispy-medicos.entrypoints=websecure"
                  - "traefik.http.routers.rispy-medicos.tls=true"
                  - "traefik.http.routers.rispy-medicos.tls.certresolver=letsencrypt"
                  - "traefik.http.routers.rispy-medicos.service=rispy-health"
                  - "traefik.docker.network=traefik-public"
            networks:
              traefik-public:
                external: true
            YAML
            # Copia de seguridad diaria de la base (Ley 26.529 / Dto. 98/23 art. 4 inc. i): 03:15, se guardan 90 días
            mkdir -p /opt/mediclick/backups /opt/mediclick/logs
            cat > /opt/mediclick/backup-diario.sh <<'SH'
            #!/bin/sh
            set -e
            U=$(docker exec mediclick-db printenv POSTGRES_USER); D=$(docker exec mediclick-db printenv POSTGRES_DB)
            F=/opt/mediclick/backups/tuconsultorio_$(date +%Y-%m-%d_%H%M).sql.gz
            docker exec mediclick-db pg_dump -U "$U" "$D" | gzip > "$F.tmp" && mv "$F.tmp" "$F"
            find /opt/mediclick/backups -name 'tuconsultorio_*.sql.gz' -mtime +90 -delete
            echo "$(date -Is) backup ok $(du -h "$F" | cut -f1)"
            SH
            sed -i 's/^            //' /opt/mediclick/backup-diario.sh
            chmod 700 /opt/mediclick/backup-diario.sh
            if command -v crontab >/dev/null 2>&1; then
              ( crontab -l 2>/dev/null | grep -v backup-diario.sh ; echo "15 3 * * * /opt/mediclick/backup-diario.sh >> /opt/mediclick/logs/backup.log 2>&1" ) | crontab -
            fi
            if command -v systemctl >/dev/null 2>&1 && ! crontab -l 2>/dev/null | grep -q backup-diario; then
              printf '[Unit]\nDescription=Backup diario TuConsultorio\n[Service]\nType=oneshot\nExecStart=/bin/sh -c "/opt/mediclick/backup-diario.sh >> /opt/mediclick/logs/backup.log 2>&1"\n' > /etc/systemd/system/tuconsultorio-backup.service
              printf '[Unit]\nDescription=Backup diario TuConsultorio 03:15\n[Timer]\nOnCalendar=*-*-* 03:15:00\nPersistent=true\n[Install]\nWantedBy=timers.target\n' > /etc/systemd/system/tuconsultorio-backup.timer
              systemctl daemon-reload && systemctl enable --now tuconsultorio-backup.timer || echo "timer backup falló"
            fi
            ls /opt/mediclick/backups/tuconsultorio_*.sql.gz >/dev/null 2>&1 || /opt/mediclick/backup-diario.sh || echo "primer backup falló"
            BASE=$(ls docker-compose.yml compose.yaml compose.yml 2>/dev/null | head -1)
            FILES="-f $BASE"
            [ -f docker-compose.override.yml ] && FILES="$FILES -f docker-compose.override.yml"
            FILES="$FILES -f docker-compose.rispy.yml"
            docker compose $FILES pull api
            docker compose $FILES up -d --force-recreate --no-deps api
            docker image prune -f
            sleep 8
            curl -sf http://localhost:3100/api/v1/health && echo "API OK" || echo "API WARN"
