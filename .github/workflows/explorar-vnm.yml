name: Explorar VNM (ANMAT)
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 --no-save && npx playwright install --with-deps chromium >/dev/null
      - name: Explorar LOMAC
        run: node scripts/lomac-explorar.js
      - uses: actions/upload-artifact@v4
        with: { name: capturas, path: "*.png" }
