name: Explorar VNM (ANMAT)
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: VNM online
        run: |
          set +e
          for u in https://anmatvademecum.servicios.pami.org.ar/ https://anmatvademecum.servicios.pami.org.ar/index.html http://anmatvademecum.servicios.pami.org.ar/; do
            echo "=== $u"; curl -skL --max-time 40 -D h.txt "$u" -o p.html; head -3 h.txt; wc -c p.html
            grep -oiE '(src|href|action)="[^"]+"' p.html | head -30
            grep -oiE "(url|ajax|fetch|\\.php|\\.aspx|\\.zul|/api/)[^\"' ]{0,80}" p.html | sort -u | head -30
          done
          for js in $(grep -oiE 'src="[^"]+\.js[^"]*"' p.html | sed -E 's/src="|"//g' | head -8); do
            case "$js" in http*) U=$js;; /*) U=https://anmatvademecum.servicios.pami.org.ar$js;; *) U=https://anmatvademecum.servicios.pami.org.ar/$js;; esac
            echo "=== JS $U"; curl -skL --max-time 40 "$U" | grep -oiE "(url\s*:\s*['\"][^'\"]+|['\"][^'\"]*\.(php|aspx|ashx|json|zul)[^'\"]*|/api/[^'\"]+)" | sort -u | head -20
          done
