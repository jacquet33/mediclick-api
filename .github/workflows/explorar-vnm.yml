name: Explorar VNM (ANMAT)
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: CKAN salud
        run: |
          set +e
          for q in "group_show?id=vademecum-y-medicamentos&include_datasets=true" "package_search?q=medicamentos&rows=50" "package_search?q=vademecum&rows=50"; do
            echo "=== $q"
            curl -skL --max-time 60 "https://datos.salud.gob.ar/api/3/action/$q" -o r.json; wc -c r.json
            python3 - <<'PY'
          import json
          try: d=json.load(open('r.json'))['result']
          except Exception as e: print('ERR',e); raise SystemExit
          pk=d.get('packages') or d.get('results') or []
          for p in pk:
            print('DS',p.get('name'),'|',p.get('title'),'|',p.get('metadata_modified','')[:10])
            for r in p.get('resources',[]): print('   R',r.get('format'),'|',(r.get('last_modified') or r.get('created') or '')[:10],'|',r.get('url'))
          PY
          done
