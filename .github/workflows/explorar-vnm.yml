name: Explorar VNM (ANMAT)
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Datasets PAMI
        run: |
          set +e
          pip install -q openpyxl xlrd >/dev/null 2>&1
          for id in pami-listado-precios-medicamentos-para-afiliados pami-listado-precios-medicamentos-para-entidades pami-listado-medicamentos-mas-consumidos; do
            echo "== $id"
            curl -sL --max-time 60 "https://datos.gob.ar/api/3/action/package_show?id=$id" -o pkg.json
            python3 -c "
          import json
          d=json.load(open('pkg.json'))['result']
          print('MODIF', d.get('metadata_modified'))
          for r in d.get('resources',[])[-4:]:
            print('REC', r.get('name'), '|', r.get('format'), '|', r.get('last_modified') or r.get('created'), '|', r.get('url'))
          " 2>&1 | head -8
          done
      - name: Muestras
        run: |
          set +e
          pip install -q pandas openpyxl >/dev/null 2>&1
          curl -sL --max-time 180 "http://datos.pami.org.ar/dataset/b7a2600f-94e0-48ba-8042-0cd4b556423b/resource/59b035cf-09b3-4058-b06b-8e49b99fa698/download/gavade_20260701_110736.csv" -o g.csv
          curl -sL --max-time 180 "http://datos.pami.org.ar/dataset/b40f7569-3a23-46bf-8a45-dd7cff41e725/resource/92ad6862-af8e-4047-b2cb-4bfef705feb3/download/afiliados20260701_110650.xlsx" -o a.xlsx
          ls -la g.csv a.xlsx
          python3 - <<'PY'
          import pandas as pd
          for f in ['g.csv','a.xlsx']:
            try:
              df=pd.read_csv(f,sep=None,engine='python',encoding='latin1') if f.endswith('csv') else pd.read_excel(f)
            except Exception as e:
              print(f,'ERR',e); continue
            print('ARCHIVO',f,'FILAS',len(df)); print('COLS',df.columns.tolist())
            print(df.head(6).to_string()[:2500])
            for c in df.columns:
              print('NUNIQ',c,df[c].nunique())
            m=[c for c in df.columns if 'refri' in ''.join(map(str,df[c].astype(str).str.lower().head(0)))]
            s=df.astype(str).apply(lambda r:' '.join(r).lower(),axis=1)
            print('REFRIANEX', s.str.contains('refrianex').sum(), '| AMOXIDAL', s.str.contains('amoxidal').sum(), '| TAFIROL', s.str.contains('tafirol').sum())
          PY
