name: Explorar VNM (ANMAT)
on:
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: LOMAC
        run: |
          set +e
          U=https://servicios.pami.org.ar/vademecum/views/consultaPublica/listado.zul
          curl -skL --max-time 60 -c c.txt -D h.txt "$U" -o p.html; head -5 h.txt; wc -c p.html
          grep -oiE "(excel|xls|csv|export|descarg|download|pdf)[^<\"']{0,80}" p.html | sort -u | head -20
          grep -oE "zk\.Desktop[^;]{0,200}|dtid[^,]{0,60}" p.html | head -5
          grep -oE "'(label|value|placeholder)','[^']{0,60}'" p.html | sort -u | head -60
          echo "=== otros"
          for u in https://servicios.pami.org.ar/vademecum/ https://servicios.pami.org.ar/vademecum/views/consultaPublica/ https://www.anmat.gob.ar/Medicamentos/Autorizaciones_VNM.asp https://www.anmat.gov.ar/Medicamentos/Autorizaciones_VNM.asp; do
            echo "--- $u"; curl -skL --max-time 40 -D - "$u" -o q.html | head -1; wc -c q.html; grep -oiE 'href="[^"]*\.(xls|xlsx|csv|zip|txt)"' q.html | head -10
          done
