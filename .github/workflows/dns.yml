name: DNS y correo
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Registros del dominio
        run: |
          D=tusrecetasmed.com
          for t in MX TXT NS; do echo "::notice::DNS $t $(dig +short $t $D @1.1.1.1 | tr '\n' ' ' | cut -c1-400)"; done
          echo "::notice::DNS DMARC $(dig +short TXT _dmarc.$D @1.1.1.1 | tr '\n' ' ')"
          for mx in $(dig +short MX $D @1.1.1.1 | awk '{print $2}'); do echo "::notice::MX $mx -> $(dig +short A $mx @1.1.1.1 | head -2 | tr '\n' ' ')"; done
